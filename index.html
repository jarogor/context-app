<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Текстура</title>
    <style>
      /* Экран загрузки до сборки приложения: цвета — токены дизайн-системы
         (`packages/ui/src/tokens.css`), выбор — по системной теме. Статичная
         разметка нужна, чтобы окно не было пустым, пока грузится бандл; её
         убирает src/main.ts при монтировании оболочки. Окно показывается
         только после первой отрисовки этого экрана. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: #f5f6f8;
        color: #1f2933;
      }
      #boot {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #6b7280;
      }
      #boot .boot-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #12151a;
          color: #e7eaf0;
        }
        #boot {
          color: #9aa4b2;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div class="boot-spinner"></div>
        <p>Загрузка…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
