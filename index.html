<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Контекст</title>
    <script>
      /* Оформление экрана загрузки до бандла.
       *
       * Значения берутся из `localStorage` (ключ `context.appearance`): там
       * оболочка держит зеркало сохранённой темы и палитры, потому что до
       * загрузки бандла ядро недоступно. Если зеркала ещё нет, экран следует
       * системной теме и палитре по умолчанию. Так экран загрузки сразу
       * совпадает с выбранным оформлением, а не мелькает чужим набором. */
      (function () {
        var appearance = null;
        try {
          appearance = JSON.parse(localStorage.getItem('context.appearance') || 'null');
        } catch (error) {
          appearance = null;
        }
        var known = ['mist', 'linen', 'frost', 'amber'];
        // Прежнее имя палитры «Иней»: сохранённое значение не сбрасывается.
        var legacy = { cobalt: 'frost', gruvbox: 'amber' };
        var stored = appearance && appearance.palette;
        if (stored && legacy[stored]) {
          stored = legacy[stored];
        }
        var palette = known.indexOf(stored) >= 0 ? stored : 'mist';
        var preference = appearance && appearance.theme ? appearance.theme : 'system';
        var dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.palette = palette;
        root.dataset.theme = dark ? 'dark' : 'light';
        /* Язык экрана загрузки: до бандла словари недоступны, поэтому оболочка
           держит выбранный язык в `localStorage` (ключ `context.locale`). Без
           зеркала экран русский — как и язык по умолчанию. */
        var locale = 'ru';
        try {
          locale = localStorage.getItem('context.locale') === 'en' ? 'en' : 'ru';
        } catch (error) {
          locale = 'ru';
        }
        root.lang = locale;
        root.dataset.locale = locale;
      })();
    </script>
    <style>
      /* Экран загрузки: единственное описание вида. Оно здесь, а не в
         компоненте, потому что этот блок нужен ещё до бандла (пока грузится
         Svelte) и остаётся в документе после — поэтому и оболочечный экран
         (`BootstrapLoading`) рисуется теми же классами, и подмена одного экрана
         другим незаметна. Цвета — токены активной палитры, выбранные скриптом
         выше по сохранённому оформлению. Значения простые и намеренно не
         зависят от собранного CSS. */
      :root {
        color-scheme: light;
        --boot-background: #f1ece1;
        --boot-foreground: #1f1d1a;
        --boot-muted-foreground: #6d675c;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --boot-background: #17191a;
        --boot-foreground: #e7e2d7;
        --boot-muted-foreground: #9d968a;
      }
      :root[data-palette='frost'] {
        --boot-background: #e6ecf7;
        --boot-foreground: #0f1622;
        --boot-muted-foreground: #495a78;
      }
      :root[data-palette='frost'][data-theme='dark'] {
        --boot-background: #0c1526;
        --boot-foreground: #e4e9f4;
        --boot-muted-foreground: #90a0bd;
      }
      :root[data-palette='amber'] {
        --boot-background: #f8e7c5;
        --boot-foreground: #3c3836;
        --boot-muted-foreground: #715e49;
      }
      :root[data-palette='amber'][data-theme='dark'] {
        --boot-background: #2b2523;
        --boot-foreground: #ebdbb2;
        --boot-muted-foreground: #b3a08c;
      }
      :root[data-palette='mist'] {
        --boot-background: #f3f4f5;
        --boot-foreground: #1b1e21;
        --boot-muted-foreground: #565b60;
      }
      :root[data-palette='mist'][data-theme='dark'] {
        --boot-background: #16181a;
        --boot-foreground: #eceef0;
        --boot-muted-foreground: #9aa0a6;
      }
      /* Шрифт и кегль экрана загрузки совпадают с приложением (`--font-sans` из
         `tokens.css`, `html { font-size: 16px }`). Значения дублируются, потому
         что до бандла собранный CSS недоступен, но обязаны совпадать буквально:
         расхождение стека (`system-ui` против `sans-serif`) в WebKitGTK на Linux
         даёт другой шрифт, и в момент загрузки бандла текст «прыгает».
         Совпадение стека проверяется тестом `boot-screen.test.ts`. */
      html,
      body {
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
          Arial, sans-serif;
      }
      body {
        margin: 0;
        background: var(--boot-background);
        color: var(--boot-foreground);
        font-size: 16px;
        line-height: 1.5;
      }
      .boot-screen {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        color: var(--boot-muted-foreground);
      }
      /* Отступ абзаца обнуляется: интервал задаёт `gap`; у пользовательского
         агента `<p>` есть margin, из-за которого расстояние «индикатор↔текст»
         отличалось бы от оболочечного экрана. */
      .boot-screen p {
        margin: 0;
      }
      /* Индикатор — тот же значок, что и `Spinner` дизайн-системы (24×24,
         штрих 4). `display: block` обязателен: до бандла Tailwind ещё не
         загружен и `<svg>` был бы инлайновым (тянул базовую линию и лишний
         отступ), а после — блочным; без общего правила высота и зазор «прыгали». */
      .boot-spinner {
        display: block;
        width: 24px;
        height: 24px;
        flex: none;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" class="boot-screen">
        <svg
          class="boot-spinner"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.25" />
          <path
            d="M12 2a10 10 0 0 1 10 10"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
        <p id="boot-text">Загрузка…</p>
      </div>
    </div>
    <script>
      /* Текст экрана загрузки по выбранному языку. Отдельный скрипт после
         разметки: язык определяется в `<head>`, а элемент `#boot-text` к тому
         моменту ещё не разобран. Оболочка затем показывает тот же текст из
         словаря, поэтому подмена экранов незаметна. */
      (function () {
        var english = document.documentElement.lang === 'en';
        var bootText = document.getElementById('boot-text');
        if (bootText && english) {
          bootText.textContent = 'Loading…';
        }
        /* Название приложения тоже следует языку: до бандла словарь недоступен,
           поэтому имя дублируется здесь, как и текст экрана загрузки. Знак на
           плашке — буква «К» — не переводится. */
        document.title = english ? 'Context' : 'Контекст';
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
