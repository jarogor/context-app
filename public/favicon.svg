<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Знак приложения «Контекст» — буква «К» на плашке.

    Плашка основного цвета со скруглением, буква — цветом фона, набрана
    полужирным шрифтом и посажена по центру плашки. Тот же знак, что в шапке
    приложения: буква шрифтом, а не контуром.
  -->
  <rect width="1024" height="1024" rx="164" fill="#2e5c52" />
  <text
    x="512"
    y="512"
    font-family="DejaVu Sans, Verdana, sans-serif"
    font-size="640"
    font-weight="bold"
    fill="#f4f1e9"
    text-anchor="middle"
    dominant-baseline="central"
  >К</text>
</svg>
