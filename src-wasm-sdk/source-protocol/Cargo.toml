[package]
name = "source-protocol"
version = "0.1.0"
description = "Контракт source-плагинов приложения «Текстура»: модели, доступ и запросы"
edition = "2021"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
