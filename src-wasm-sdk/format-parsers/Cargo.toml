[package]
name = "format-parsers"
version = "0.1.0"
description = "Разбор книжных форматов (EPUB, XML) для source-плагинов «Текстуры»"
edition = "2021"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
source-protocol = { path = "../source-protocol" }
