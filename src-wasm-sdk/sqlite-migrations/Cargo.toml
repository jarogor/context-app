[package]
name = "sqlite-migrations"
version = "0.1.0"
description = "Версионированные миграции схемы SQLite-хранилища плагинов «Текстуры»"
edition = "2021"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
