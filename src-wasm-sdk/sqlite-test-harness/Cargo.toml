[package]
name = "sqlite-test-harness"
version = "0.1.0"
description = "Нативный SQL-движок для тестов source-плагинов «Текстуры»"
edition = "2021"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
