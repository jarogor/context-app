[package]
name = "library"
version = "0.1.0"
description = "Базовый source-плагин создания/открытия библиотеки для Jarogor BookLib"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"