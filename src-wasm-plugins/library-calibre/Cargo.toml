[package]
name = "library-calibre"
version = "0.1.0"
description = "Source-плагин библиотеки Calibre для приложения «Текстура»"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
index-migrations = { path = "../index-migrations" }
source-common = { path = "../source-common" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
source-common = { path = "../source-common", features = ["test-sql"] }
