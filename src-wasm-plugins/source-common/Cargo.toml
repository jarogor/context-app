[package]
name = "source-common"
version = "0.1.0"
description = "Общие модели и хелперы source-плагинов библиотек для приложения «Текстура»"
edition = "2021"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
index-migrations = { path = "../index-migrations" }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[features]
# Нативный SQL-движок для тестов source-плагинов (в WASM не собирается).
test-sql = ["dep:rusqlite"]
