[package]
name = "books-source"
version = "0.1.0"
description = "Плагин источника книг «директория книг» для приложения «Контекст»"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
format-parsers = { path = "../../src-wasm-sdk/format-parsers" }
source-index = { path = "../../src-wasm-sdk/source-index" }
source-protocol = { path = "../../src-wasm-sdk/source-protocol" }
sqlite-migrations = { path = "../../src-wasm-sdk/sqlite-migrations" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-test-harness = { path = "../../src-wasm-sdk/sqlite-test-harness" }
