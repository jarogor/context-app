<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Читалка PDF</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* Фон вокруг страниц следует теме области чтения (приложение шлёт
           значение в переменную). */
        background: var(--reader-background, #525659);
        font-family: system-ui, sans-serif;
      }
      /* Область прокрутки: книга показывается целиком, все страницы подряд. */
      #viewer {
        position: absolute;
        inset: 0;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #8a8f98 #3f4247;
      }
      #viewer::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      #viewer::-webkit-scrollbar-track {
        background: #3f4247;
      }
      #viewer::-webkit-scrollbar-thumb {
        background: #8a8f98;
        border-radius: 6px;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Контейнер растягивается под самую широкую страницу, поэтому страница
           шире области чтения переполняет контейнер вправо (достижима прокруткой),
           а не влево (левая часть такой страницы была бы обрезана и недостижима).
           При страницах уже области чтения min-width удерживает ширину окна, и
           страницы центрируются. */
        width: max-content;
        min-width: 100%;
        gap: 12px;
        padding: 16px 0;
      }
      .page {
        position: relative;
        /* Пока страница не отрисована (или показана окном при сильном
           увеличении), виден фон рамки: в тёмной теме он тоже тёмный, иначе
           белые прямоугольники вспыхивали бы на тёмном окружении. */
        background: var(--page-background, #fff);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        /* Подсветки заметок смешиваются только со страницей, не с фоном окна. */
        isolation: isolate;
      }
      .page canvas {
        /* Канвас покрывает видимую область страницы и позиционируется по ней. */
        position: absolute;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        /* Слой заметок лежит выше канваса и текстового слоя по порядку в DOM
           (вставляется последним), поэтому `z-index` ему не нужен. И его нельзя
           задавать: `z-index` создаёт контекст наложения, внутри которого
           `mix-blend-mode` подсветки смешивался бы с прозрачным фоном слоя, а не
           с канвасом страницы, и полупрозрачный цвет выбеливал бы текст. */
        pointer-events: none;
      }
      .overlay .note {
        position: absolute;
        /* Цвет подсветки задаётся приложением по теме области чтения; запасной —
           прежний жёлтый. */
        background: var(--note-yellow, rgba(253, 224, 71, 0.65));
        /* Умножение сохраняет тёмный текст контрастным, а фон делает цветным. */
        mix-blend-mode: multiply;
        border-radius: 2px;
        pointer-events: auto;
        cursor: pointer;
      }
      /* Тёмная страница: умножение на тёмном фоне давало бы невидимую тёмную
         подложку, поэтому подсветка и фигура ложатся осветлением. */
      html[data-reader-theme='dark'] .overlay .note,
      html[data-reader-theme='dark'] .overlay .note-shape {
        mix-blend-mode: screen;
      }
      .overlay .note[data-flash='true'] {
        background: rgba(245, 158, 11, 0.85) !important;
      }
      /* Карточка текстовой заметки в долях страницы. */
      .overlay .note-card {
        position: absolute;
        max-width: 220px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
        /* Текст карточки берёт сторону темы: на тёмной подложке — светлый. */
        color: var(--reader-foreground, #1f2937);
        pointer-events: auto;
        cursor: pointer;
      }
      /* Слой фигур: не перехватывает события вне своих линий. */
      .overlay .note-shape {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        /* Фигура ложится на текст умножением, как подсветка цитаты: цвет заливки
           сохраняется, а текст под ней остаётся контрастным. Режим задан на слое
           фигуры, а не на её SVG-элементах: на дочерних элементах он в WebKit не
           применяется, и фигура становится невидимой. */
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      /* Фигура — полупрозрачная заливка цветом заметки, как подсветка цитаты,
         без обводки: прямоугольник и эллипс залиты, линия — толстый штрих.
         Видимая фигура пропускает события, выбор идёт по мишени ниже. */
      .overlay .note-shape line,
      .overlay .note-shape rect,
      .overlay .note-shape ellipse {
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }
      /* Мягкость заливки задаётся прозрачностью на слое фигуры: цвет берётся из
         темы области чтения, а прозрачность — общая для всех поверхностей. */
      .overlay .note-shape rect,
      .overlay .note-shape ellipse {
        fill-opacity: 0.5;
      }
      .overlay .note-shape line {
        stroke-opacity: 0.6;
      }
      /* Прозрачная мишень по всей фигуре: у линии это широкий штрих, у
         прямоугольника и эллипса — вся залитая область. */
      .overlay .note-shape .note-shape-hit {
        fill: transparent;
        stroke: transparent;
        stroke-width: 16;
        vector-effect: non-scaling-stroke;
        pointer-events: all;
        cursor: pointer;
      }
      /* Направляющие перемещения: рамка выбранной заметки и её оси. */
      .overlay .note-move-guide {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed #2563eb;
        background: rgba(37, 99, 235, 0.08);
        pointer-events: none;
        z-index: 15;
      }
      .overlay .note-move-guide::before,
      .overlay .note-move-guide::after {
        content: '';
        position: absolute;
        background: #2563eb;
        opacity: 0.6;
      }
      .overlay .note-move-guide::before {
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
      }
      .overlay .note-move-guide::after {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
      }
      .overlay .note-card[data-flash='true'],
      .overlay .note-shape[data-flash='true'] {
        opacity: 0.4;
      }
      /* Рамка предпросмотра фигуры во время протяжки. */
      .overlay .note-preview {
        position: absolute;
        border: 1px dashed #2563eb;
        pointer-events: none;
      }
      /* Контекстное меню заметки на странице. */
      .overlay .note-menu {
        position: absolute;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        font-size: 12px;
        pointer-events: auto;
      }
      .overlay .note-menu button {
        cursor: pointer;
        border: 1px solid #d1d5db;
        background: #f3f4f6;
        border-radius: 4px;
        padding: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font: inherit;
      }
      .overlay .note-menu button svg {
        display: block;
        pointer-events: none;
      }
      .overlay .note-menu button:hover {
        background: #e5e7eb;
      }
      /* Во время правки границ цитаты подсветка не должна перехватывать
         указатель: по позиции курсора определяется символ текста под ним. */
      body[data-editing='resize'] .overlay .note,
      body[data-editing='resize'] .overlay .note-card,
      body[data-editing='resize'] .overlay .note-shape {
        pointer-events: none;
      }
      /* Маркер границы цитаты при правке. */
      .overlay .note-handle {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: #1d4ed8;
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        cursor: ew-resize;
        z-index: 25;
        pointer-events: auto;
      }
      body[data-editing='move'] .overlay .note-card,
      body[data-editing='move'] .overlay [data-note-id] {
        cursor: move;
      }
      .textLayer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        /* Свойства ниже выравнивают метрики слоя с официальным просмотрщиком
           pdf.js: без них унаследованные от оболочки `letter-spacing`/
           `word-spacing`/`text-align`/`text-size-adjust` сдвигали бы глифы
           относительно прямоугольников выделения. */
        text-align: initial;
        line-height: 1;
        letter-spacing: normal;
        word-spacing: normal;
        text-size-adjust: none;
        -webkit-text-size-adjust: none;
        transform-origin: 0 0;
      }
      .textLayer span,
      .textLayer br {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      /* Выделение текста рисует собственный слой (см. `renderSelection`), а не
         браузер: браузер кладёт прямоугольник на каждую строку, и при плотном
         межстрочном интервале они перекрываются — на стыках заливка темнеет, а
         текст мутнеет. Нативное выделение прозрачно, только для копирования. */
      .textLayer ::selection {
        background: transparent;
      }
      /* Слой выделения: заливка по строкам и вертикальные метки по краям всего
         выделения. Заливка — один элемент во всю страницу, обрезанный по
         прямоугольникам диапазона (как в официальном просмотрщике pdf.js): сырые
         прямоугольники строк могут перекрываться по высоте, а единая маска не даёт
         заливке темнеть на стыках и не сужает полосы до середины букв. Заливка
         ложится на страницу умножением (на тёмной стороне — осветлением), как
         подсветка цитаты, поэтому растр текста остаётся чётким. */
      .selection-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .selection-layer .selection-fill {
        position: absolute;
        inset: 0;
        background: var(--reader-selection, rgba(37, 99, 235, 0.35));
        mix-blend-mode: multiply;
      }
      .selection-layer .selection-fill svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      html[data-reader-theme='dark'] .selection-layer .selection-fill {
        mix-blend-mode: screen;
      }
      .selection-layer .selection-band {
        position: absolute;
        pointer-events: none;
      }
      /* Признак активного выделения: вертикальные метки по краям полос — «курсоры»
         выделения. Отличают живое выделение от подсветки заметки (та меток не
         получает). Метки плотнее заливки, но того же оттенка, и лежат внутри слоя
         с наложением, поэтому остаются чёткими на растре. */
      .selection-layer .selection-band::before,
      .selection-layer .selection-band::after {
        content: none;
        position: absolute;
        top: -1px;
        bottom: -1px;
        width: var(--reader-selection-edge-width, 2px);
        background: var(--reader-selection-edge, rgba(37, 99, 235, 0.9));
        border-radius: 1px;
      }
      /* Метки стоят у краёв всего выделения: левая — в начале, правая — в конце.
         У промежуточных строк меток нет, иначе они читаются как отдельные
         выделения (особенно при строках разной длины). Метка сдвинута НАРУЖУ от
         полосы на свою ширину: тогда она попадает в промежуток между буквами
         (перед первой и после последней буквой выделения), а не ложится на глиф. */
      .selection-layer .selection-band[data-edge='start']::before,
      .selection-layer .selection-band[data-edge='both']::before {
        content: '';
        left: calc(-1 * var(--reader-selection-edge-width, 2px));
      }
      .selection-layer .selection-band[data-edge='end']::after,
      .selection-layer .selection-band[data-edge='both']::after {
        content: '';
        right: calc(-1 * var(--reader-selection-edge-width, 2px));
      }
      /* Инструменты текста и фигуры не работают с выделением: прицел вместо
         текстового курсора и запрет выделения текста под протяжкой. */
      body[data-tool='text'],
      body[data-tool='shape'] {
        cursor: crosshair;
      }
      body[data-tool='text'] *,
      body[data-tool='shape'] * {
        cursor: crosshair !important;
        user-select: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5e7eb;
        padding: 24px;
        text-align: center;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewer"><div id="pages"></div></div>
    <div id="status">Ожидание книги…</div>

    <!--
      Классический скрипт выполняется до модульного: он получает blob-адреса
      файлов модуля (движок и worker). Модуль импортирует движок напрямую по
      этому адресу — без карты импорта и без сети.
    -->
    <script>
      (function () {
        window.__texturePdfEngine = textureViewerUrl('./pdf.mjs');
        window.__texturePdfWorker = textureViewerUrl('./pdf.worker.mjs');
      })();
    </script>

    <script type="module">
      const CHANNEL = 'texture-workplace';
      /** Соответствие пункта PDF и CSS-пикселя: 100 % — естественный размер. */
      const CSS_UNITS = 96 / 72;

      const status = document.getElementById('status');
      const viewer = document.getElementById('viewer');
      const pagesEl = document.getElementById('pages');

      let pdfjsLib = null;
      let doc = null;
      let pageCount = 0;
      let zoom = 100;
      let initialZoom = 100;
      let notes = [];
      /** Активный инструмент создания заметок: тип, вид фигуры, цвет. */
      let tool = { type: 'quote', shape: 'line', color: 'yellow' };
      /** Идёт протяжка фигуры: раздел, начало и текущая точка в долях страницы. */
      let shapeDrag = null;
      /** Контекстное меню заметки: заметка, страница и её элемент. */
      let noteMenu = null;
      /** Режим правки заметки: перемещение или сдвиг границ цитаты. */
      let editing = null;
      /** Тяга перемещения заметки: заметка, исходное место и точка захвата. */
      let moveDrag = null;
      /** Элемент направляющих перемещения (рамка и оси выбранной заметки). */
      let moveGuide = null;
      /** Тяга границы цитаты в PDF: прямоугольники выделения и край. */
      let resizeDrag = null;
      /** Подавление выбора заметки сразу после завершения правки. */
      let editClickSuppress = false;
      /** Натуральный размер каждой страницы при масштабе 1 (CSS px). */
      let naturalSizes = [];
      /** Отрисованные страницы: элемент страницы → её холст. */
      const rendered = new Map();
      /** Страницы, отрисовка которых уже идёт. */
      const pending = new Set();
      /** Поколение рендера: смена масштаба отменяет незавершённые отрисовки. */
      let renderEpoch = 0;
      /** Сторона темы области чтения: `light` или `dark`. */
      let readerTheme = 'light';
      /** Отпечаток раскраски страниц: сторона темы и цвета бумаги/текста.
       *
       * Нарисованный растр хранит отпечаток, под который он сделан
       * (`entry.paint`). Пока отпечаток совпадает с текущим, страница верна и
       * перерисовки не требует; по смене — перерисовывается при первой же
       * возможности (когда окажется видимой), не полагаясь на конкретное
       * событие. */
      let paintKey = '';
      /** Запас вокруг видимой области страницы для канваса, CSS px. */
      const WINDOW_MARGIN = 512;
      /** Минимальная длина стороны канваса, CSS px. */
      const MIN_WINDOW_SIDE = 128;
      /** Предельный размер стороны канваса.
       *
       * Больше — браузер оставляет канвас белым; ограничение не даёт окну
       * выродиться на гигантском мониторе или при большом devicePixelRatio.
       */
      const MAX_CANVAS_SIDE = 8192;
      /** Предельная площадь канваса (пиксели): страховка от нехватки памяти. */
      const MAX_CANVAS_AREA = 32 * 1024 * 1024;
      /** Опорная страница окна (для удержания места при масштабе). */
      let currentPage = 1;
      let observer = null;
      let scheduled = false;
      /** Отложенный пересчёт окна канвасов после прокрутки. */
      let windowScheduled = false;
      /** Счётчик идентификаторов масок заливки выделения (уникальны на документ). */
      let selectionClipId = 0;

      function post(message) {
        message.channel = CHANNEL;
        parent.postMessage(message, '*');
      }

      function decodeBase64(value) {
        const binary = atob(String(value || ''));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      /** Масштаб отображения: 100 % — естественный размер страницы файла. */
      function currentScale() {
        return (zoom / 100) * CSS_UNITS;
      }

      /** Плотность растра канваса: не выше разумного предела и не выше
       * предела размера и площади канваса (иначе браузер оставит его белым).
       */
      function boundedRatio(width, height) {
        let ratio = Math.min(window.devicePixelRatio || 1, 2.5);
        if (width > 0 && width * ratio > MAX_CANVAS_SIDE) {
          ratio = MAX_CANVAS_SIDE / width;
        }
        if (height > 0 && height * ratio > MAX_CANVAS_SIDE) {
          ratio = MAX_CANVAS_SIDE / height;
        }
        const area = width * height;
        if (area > 0 && area * ratio * ratio > MAX_CANVAS_AREA) {
          ratio = Math.sqrt(MAX_CANVAS_AREA / area);
        }
        return Math.max(0.25, ratio);
      }

      /** Привязка координаты к пиксельной сетке устройства.
       *
       * Канвас, чей размер или положение в устройстве дробные, браузер
       * пересэмплирует при выводе — текст мутнеет. Округление до целого
       * физического пикселя убирает пересэмплирование: растр выводится 1:1.
       */
      function snapToDevice(value, ratio) {
        return Math.round(value * ratio) / ratio;
      }

      /** Признак, что вся страница помещается в пределы канваса при плотности. */
      function fitsWholePage(viewport, ratio) {
        return (
          viewport.width * ratio <= MAX_CANVAS_SIDE &&
          viewport.height * ratio <= MAX_CANVAS_SIDE &&
          viewport.width * viewport.height * ratio * ratio <= MAX_CANVAS_AREA
        );
      }

      /** Желаемое окно страницы в CSS-пикселях (координаты относительно страницы).
       *
       * Если растр всей страницы помещается в пределы канваса, рисуется вся
       * страница: тогда прокрутка внутри неё ничего не перерисовывает, и текст
       * не пропадает на время отрисовки. Окно видимой области с запасом
       * применяется только к страницам, которые целиком не помещаются (сильное
       * увеличение) — там память ограничивается видимой областью.
       */
      function desiredWindow(rect, viewerRect, viewport) {
        const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
        if (fitsWholePage(viewport, ratio)) {
          return { x0: 0, y0: 0, width: viewport.width, height: viewport.height };
        }
        const x0 = Math.max(0, viewerRect.left - rect.left - WINDOW_MARGIN);
        const y0 = Math.max(0, viewerRect.top - rect.top - WINDOW_MARGIN);
        const x1 = Math.min(
          viewport.width,
          viewerRect.left + viewer.clientWidth - rect.left + WINDOW_MARGIN,
        );
        const y1 = Math.min(
          viewport.height,
          viewerRect.top + viewer.clientHeight - rect.top + WINDOW_MARGIN,
        );
        const width = Math.max(MIN_WINDOW_SIDE, x1 - x0);
        const height = Math.max(MIN_WINDOW_SIDE, y1 - y0);
        return {
          x0: Math.min(x0, Math.max(0, viewport.width - width)),
          y0: Math.min(y0, Math.max(0, viewport.height - height)),
          width: Math.min(width, viewport.width),
          height: Math.min(height, viewport.height),
        };
      }

      /** Подготовка канваса страницы: окно и плотность.
       *
       * Канвас рисуется в пикселях с плотностью devicePixelRatio: вся страница,
       * если её растр помещается в пределы канваса (обычные масштабы), иначе —
       * окно видимой области с запасом (сильное увеличение), чтобы память была
       * ограничена видимой областью. Геометрия задаётся до отрисовки:
       * изменение размеров канваса после неё стёрло бы рисунок. Границы окна
       * привязаны к пиксельной сетке устройства по абсолютной экранной позиции:
       * сама страница стоит в дробной координате, поэтому иначе браузер
       * пересэмплирует растр и текст мутнеет.
       */
      function setupCanvas(pageEl, viewport) {
        const canvas = document.createElement('canvas');
        const rect = pageEl.getBoundingClientRect();
        const viewerRect = viewer.getBoundingClientRect();
        const base = desiredWindow(rect, viewerRect, viewport);
        const ratio = boundedRatio(base.width, base.height);
        const absX0 = snapToDevice(rect.left + base.x0, ratio);
        const absY0 = snapToDevice(rect.top + base.y0, ratio);
        const absRight = snapToDevice(rect.left + base.x0 + base.width, ratio);
        const absBottom = snapToDevice(rect.top + base.y0 + base.height, ratio);
        const x = absX0 - rect.left;
        const y = absY0 - rect.top;
        const width = Math.max(1, absRight - absX0);
        const height = Math.max(1, absBottom - absY0);
        canvas.width = Math.max(1, Math.round(width * ratio));
        canvas.height = Math.max(1, Math.round(height * ratio));
        canvas.style.left = x + 'px';
        canvas.style.top = y + 'px';
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        return {
          canvas,
          info: { x, y, width, height, ratio },
        };
      }

      /** Доля прочитанного по положению прокрутки. */
      function scrollProgress() {
        const max = viewer.scrollHeight - viewer.clientHeight;
        return max > 0 ? Math.max(0, Math.min(100, (viewer.scrollTop / max) * 100)) : 0;
      }

      /** Размер страницы в пикселях при текущем масштабе. */
      function pageSize(index) {
        const natural = naturalSizes[index] || naturalSizes[0] || { width: 612, height: 792 };
        const scale = currentScale();
        return { width: natural.width * scale, height: natural.height * scale };
      }

      /** Обновление размеров страниц после уточнения их размеров. */
      function resizePage(index) {
        const pageEl = pagesEl.children[index];
        if (!pageEl || pageEl.dataset.rendered === '1') {
          return;
        }
        const size = pageSize(index);
        pageEl.style.width = size.width + 'px';
        pageEl.style.height = size.height + 'px';
      }

      function reportState() {
        post({ type: 'state', value: { page: currentPage, pages: pageCount, zoom } });
        post({ type: 'progress', value: scrollProgress() });
      }

      async function loadEngine() {
        if (pdfjsLib) {
          return pdfjsLib;
        }
        pdfjsLib = await import(window.__texturePdfEngine);
        pdfjsLib.GlobalWorkerOptions.workerSrc = window.__texturePdfWorker;
        return pdfjsLib;
      }

      /** Построение каркаса страниц: размеры без рендера. */
      function layoutPages() {
        pagesEl.replaceChildren();
        for (let index = 0; index < pageCount; index += 1) {
          const size = pageSize(index);
          const pageEl = document.createElement('div');
          pageEl.className = 'page';
          pageEl.dataset.page = String(index + 1);
          pageEl.style.width = size.width + 'px';
          pageEl.style.height = size.height + 'px';
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          pageEl.append(overlay);
          pagesEl.append(pageEl);
        }
      }

      /** Обновление размеров каркаса при смене масштаба. */
      function resizePages() {
        for (const pageEl of pagesEl.children) {
          const index = Number(pageEl.dataset.page) - 1;
          const size = pageSize(index);
          pageEl.style.width = size.width + 'px';
          pageEl.style.height = size.height + 'px';
        }
      }

      function overlayOf(pageEl) {
        return pageEl.querySelector('.overlay');
      }

      /** Освобождение канваса и текстового слоя страницы (память при прокрутке). */
      function releasePage(pageEl) {
        pending.delete(pageEl);
        const entry = rendered.get(pageEl);
        delete pageEl.dataset.rendered;
        // Слой выделения привязан к положению текста: вместе с канвасом он
        // снимается и будет построен заново, когда страница отрисуется.
        const selectionLayer = pageEl.querySelector('.selection-layer');
        if (selectionLayer) {
          selectionLayer.remove();
        }
        if (!entry) {
          return;
        }
        entry.canvas.remove();
        entry.textLayer.remove();
        rendered.delete(pageEl);
      }

      /** Открепление страницы для повторной отрисовки окна.
       *
       * Старый канвас не удаляется: он остаётся видимым, пока новый не будет
       * готов. Иначе прокрутка внутри большой страницы на время отрисовки
       * обнажала бы белый прямоугольник — текст «пропадал» и мигал.
       */
      function detachForRerender(pageEl) {
        const entry = rendered.get(pageEl);
        rendered.delete(pageEl);
        delete pageEl.dataset.rendered;
        return entry || null;
      }

      /** Возврат ранее откреплённого канваса, если новая отрисовка не удалась. */
      function restoreRendered(pageEl, entry) {
        if (entry && pageEl.isConnected && !rendered.has(pageEl)) {
          rendered.set(pageEl, entry);
          pageEl.dataset.rendered = '1';
        }
      }

      /** Отрисовка страницы: окно канваса, текстовый слой, подсветки заметок.
       *
       * При повторной отрисовке окна (`preserve`) новый канвас рисуется
       * откреплённым и вставляется только после готовности: старый остаётся
       * видимым, поэтому прокрутка не обнажает белый прямоугольник.
       */
      async function renderPage(pageEl, preserve = null) {
        if (rendered.has(pageEl) || pending.has(pageEl) || !doc) {
          restoreRendered(pageEl, preserve);
          return;
        }
        const index = Number(pageEl.dataset.page) - 1;
        const epoch = renderEpoch;
        pending.add(pageEl);
        let page;
        try {
          page = await doc.getPage(index + 1);
        } catch (error) {
          pending.delete(pageEl);
          restoreRendered(pageEl, preserve);
          return;
        }
        if (!pageEl.isConnected || epoch !== renderEpoch) {
          pending.delete(pageEl);
          restoreRendered(pageEl, preserve);
          return;
        }
        const base = page.getViewport({ scale: 1 });
        naturalSizes[index] = { width: base.width, height: base.height };
        resizePage(index);
        const scale = currentScale();
        const viewport = page.getViewport({ scale });
        pageEl.style.width = viewport.width + 'px';
        pageEl.style.height = viewport.height + 'px';
        pageEl.style.setProperty('--scale-factor', String(scale));

        const setup = setupCanvas(pageEl, viewport);
        const canvas = setup.canvas;
        const info = setup.info;
        const context = canvas.getContext('2d');
        const overlay = overlayOf(pageEl);
        if (!context || !overlay) {
          pending.delete(pageEl);
          restoreRendered(pageEl, preserve);
          return;
        }

        const textLayerEl = document.createElement('div');
        textLayerEl.className = 'textLayer';
        const entry = { canvas, textLayer: textLayerEl, info, paint: paintKey };

        // Дополнительное преобразование сдвигает страницу в начало координат
        // окна (её левый верх не совпадает с углом страницы) и задаёт плотность
        // devicePixelRatio: без него рисовалась бы левая верхняя часть страницы
        // в неверном масштабе.
        const transform = [
          info.ratio,
          0,
          0,
          info.ratio,
          -info.x * info.ratio,
          -info.y * info.ratio,
        ];

        try {
          // Рисуем во **откреплённый** канвас: pdf.js последовательно заливает
          // его фоном и содержимым, и, будь он в DOM, на экране мелькала бы белая
          // страница до перекраски. Готовый канвас вставляется одним кадром.
          await page.render({ canvasContext: context, viewport, transform }).promise;
          if (epoch !== renderEpoch) {
            throw new Error('отрисовка устарела из-за смены масштаба');
          }
          // Перекраска растра в тёмной теме: светлый фон страницы становится
          // тёмным, тёмный текст — светлым, оттенок сохраняется.
          recolorCanvas(canvas);
          const textLayer = new pdfjsLib.TextLayer({
            textContentSource: page.streamTextContent(),
            container: textLayerEl,
            viewport,
          });
          await textLayer.render();
          if (epoch !== renderEpoch) {
            throw new Error('отрисовка устарела из-за смены масштаба');
          }
          // Готовые слои встают одним кадром: при перерисовке окна старый канвас
          // удерживался до этого момента, поэтому прокрутка не обнажает пустоту.
          pageEl.insertBefore(canvas, overlay);
          pageEl.insertBefore(textLayerEl, overlay);
          if (preserve) {
            preserve.canvas.remove();
            preserve.textLayer.remove();
          }
          rendered.set(pageEl, entry);
          pageEl.dataset.rendered = '1';
          drawNotes(pageEl);
          // Слой выделения строится по положению текста: после отрисовки он
          // восстанавливается, если выделение ещё живо.
          renderSelection();
        } catch (error) {
          // Неудачная отрисовка не должна навсегда помечать страницу готовой:
          // иначе она останется белой и повторный рендер не запустится.
          if (rendered.get(pageEl) === entry) {
            rendered.delete(pageEl);
            delete pageEl.dataset.rendered;
          }
          canvas.remove();
          textLayerEl.remove();
          restoreRendered(pageEl, preserve);
        } finally {
          pending.delete(pageEl);
        }
      }

      /** Наблюдение за видимостью страниц: рендер вблизи, освобождение вдали. */
      function startObserver() {
        if (observer) {
          observer.disconnect();
        }
        observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              const pageEl = entry.target;
              if (entry.isIntersecting) {
                void renderPage(pageEl);
              } else if (entry.intersectionRatio === 0) {
                releasePage(pageEl);
              }
            }
          },
          { root: viewer, rootMargin: '1200px 0px' },
        );
        for (const pageEl of pagesEl.children) {
          observer.observe(pageEl);
        }
      }

      /** Пересчёт окон отрисованных страниц при прокрутке.
       *
       * Когда страница рисуется целиком (обычные масштабы), видимая область
       * всегда внутри её канваса, и перерисовки при прокрутке не происходит.
       * Когда страница целиком не помещается и нарисована окном, прокрутка,
       * уводящая видимую область за пределы окна, освобождает страницу и
       * рисует её заново под новое положение.
       */
      function refreshWindows() {
        windowScheduled = false;
        const viewerRect = viewer.getBoundingClientRect();
        for (const pageEl of pagesEl.children) {
          const index = Number(pageEl.dataset.page) - 1;
          if (!naturalSizes[index]) {
            continue;
          }
          const rect = pageEl.getBoundingClientRect();
          const interTop = Math.max(rect.top, viewerRect.top);
          const interBottom = Math.min(rect.bottom, viewerRect.bottom);
          const interLeft = Math.max(rect.left, viewerRect.left);
          const interRight = Math.min(rect.right, viewerRect.right);
          if (interBottom <= interTop || interRight <= interLeft) {
            continue;
          }
          const entry = rendered.get(pageEl);
          // Растр под прежний отпечаток раскраски (смена темы/палитры в скрытой
          // области или на другой странице) устарел: перерисовываем при первой
          // видимости — и при прокрутке, и при переходе на страницу. Старый
          // канвас удерживается до готовности нового, чтобы не обнажать пустоту.
          const stalePaint = entry ? entry.paint !== paintKey : false;
          if (!entry || stalePaint) {
            const stale = entry ? detachForRerender(pageEl) : null;
            void renderPage(pageEl, stale);
            continue;
          }
          // Видимая область и окно канваса — в одной системе: CSS-пиксели
          // относительно страницы.
          const visTop = interTop - rect.top;
          const visBottom = interBottom - rect.top;
          const visLeft = interLeft - rect.left;
          const visRight = interRight - rect.left;
          const info = entry.info;
          const covered =
            visTop >= info.y &&
            visBottom <= info.y + info.height &&
            visLeft >= info.x &&
            visRight <= info.x + info.width;
          if (!covered) {
            // Старый канвас удерживается до готовности нового: иначе прокрутка
            // обнажала бы белый прямоугольник на время отрисовки.
            const stale = detachForRerender(pageEl);
            void renderPage(pageEl, stale);
          }
        }
      }

      /** Планирование пересчёта окон после прокрутки. */
      function scheduleWindowRefresh() {
        if (windowScheduled) {
          return;
        }
        windowScheduled = true;
        requestAnimationFrame(refreshWindows);
      }

      /** Приведение прямоугольников цитаты к полосам строк без наложений.
       *
       * Текстовый слой PDF-движка отдаёт прямоугольник на каждую строку, и его
       * высота включает межстрочный интервал: строки «заползают» друг на друга.
       * Полупрозрачная подсветка в местах наложения становится насыщеннее, поэтому
       * прямоугольники сперва сливаются построчно (по заметному вертикальному
       * перекрытию), а затем у каждой следующей строки срезается верх до низа
       * предыдущей. Так полосы стыкуются встык: подсветка ровная и адаптивна к
       * любой высоте строки, без зашитых констант.
       */
      function lineRects(rects) {
        const items = (rects || [])
          .filter((rect) => rect.width > 0 && rect.height > 0)
          .sort(
            (a, b) => a.y + a.height / 2 - (b.y + b.height / 2) || a.x - b.x,
          );
        const lines = [];
        for (const rect of items) {
          const line = lines[lines.length - 1];
          if (line) {
            const overlap =
              Math.min(line.bottom, rect.y + rect.height) - Math.max(line.top, rect.y);
            const minHeight = Math.min(line.bottom - line.top, rect.height);
            // Заметное вертикальное перекрытие — та же строка, сливаем её куски.
            if (overlap > minHeight * 0.5) {
              line.top = Math.min(line.top, rect.y);
              line.bottom = Math.max(line.bottom, rect.y + rect.height);
              line.x = Math.min(line.x, rect.x);
              line.right = Math.max(line.right, rect.x + rect.width);
              continue;
            }
          }
          lines.push({
            top: rect.y,
            bottom: rect.y + rect.height,
            x: rect.x,
            right: rect.x + rect.width,
          });
        }
        const result = [];
        for (const line of lines) {
          let top = line.top;
          if (result.length > 0) {
            const previous = result[result.length - 1];
            const previousBottom = previous.y + previous.height;
            // Строка не должна заходить под предыдущую: иначе заливка темнеет.
            if (top < previousBottom) {
              top = previousBottom;
            }
          }
          if (line.bottom > top) {
            result.push({
              x: line.x,
              y: top,
              width: line.right - line.x,
              height: line.bottom - top,
            });
          }
        }
        return result;
      }

      /** Запасные мягкие тона заметок: светлая сторона темы области чтения.
       *
       * Приложение присылает актуальные тона сообщением `reader-theme`; до него и
       * при неполных данных используются эти значения. */
      const NOTE_COLOR_FALLBACKS = {
        yellow: '#f2cd52',
        green: '#82d991',
        blue: '#84adf0',
        red: '#ef817b',
        purple: '#bba0e8',
      };

      /** Действующие мягкие тона заметок по идентификаторам цвета. */
      const noteTones = { ...NOTE_COLOR_FALLBACKS };

      /** Цвет подсветки заметки; неизвестный идентификатор даёт жёлтый. */
      function noteColor(color) {
        return noteTones[color] || noteTones.yellow;
      }

      /** Применение темы области чтения, присланной приложением.
       *
       * На корень ставится атрибут стороны, а значения раскладываются в
       * CSS-переменные: фон вокруг страниц берёт `--reader-background`, заметки —
       * мягкие тона `--note-*`. Тёмная сторона дополнительно перекрашивает растр
       * страницы (см. `recolorCanvas`), поэтому при её смене страницы
       * перерисовываются без повторного чтения файла.
       */
      function applyReaderTheme(value) {
        const theme = value && value.id === 'dark' ? 'dark' : 'light';
        readerTheme = theme;
        document.documentElement.dataset.readerTheme = theme;
        const tokens = (value && value.tokens) || {};
        const tones = (value && value.notes) || {};
        const rootStyle = document.documentElement.style;
        // Цвета перекраски страницы: бумага и текст задаются темой (палитрой),
        // поэтому страница не уходит в нейтральный чёрный, а сохраняет оттенок.
        pageColors = createPageColors(value && value.page);
        // Смена отпечатка раскраски означает, что уже нарисованные растры
        // устарели: они перерисовываются при первой видимости. Событие смены
        // темы может прийти в скрытой области, когда рисовать нечем, поэтому
        // запоминается только сам отпечаток, а доводит отрисовку возврат
        // видимости (сообщение `show` от хоста), наблюдатель размера или
        // прокрутка — без ожидания конкретного события.
        paintKey = theme + '|' + pageColors.paperCss + '|' + pageColors.inkCss;
        rootStyle.setProperty('--reader-background', tokens.background || '#ffffff');
        rootStyle.setProperty('--reader-foreground', tokens.text || '#1f2937');
        rootStyle.setProperty('--reader-muted-foreground', tokens.muted || '#6b7280');
        rootStyle.setProperty('--reader-link', tokens.link || '#2563eb');
        rootStyle.setProperty(
          '--reader-selection',
          tokens.selection || 'rgba(37, 99, 235, 0.35)',
        );
        rootStyle.setProperty(
          '--reader-selection-edge',
          tokens.selectionEdge || 'rgba(37, 99, 235, 0.9)',
        );
        rootStyle.setProperty(
          '--reader-selection-edge-width',
          String(tokens.selectionEdgeWidth || 2) + 'px',
        );
        // Фон неотрисованной страницы совпадает с перекрашенной бумагой, иначе
        // при перерисовке мелькал бы светлый прямоугольник.
        rootStyle.setProperty(
          '--page-background',
          theme === 'dark' ? pageColors.paperCss : '#ffffff',
        );
        for (const color of Object.keys(NOTE_COLOR_FALLBACKS)) {
          const tone = tones[color] || NOTE_COLOR_FALLBACKS[color];
          noteTones[color] = tone;
          rootStyle.setProperty('--note-' + color, tone);
        }
        repaintDirtyPages();
        redrawAllNotes();
      }

      /** Доведение отрисовки после смены раскраски или возврата видимости.
       *
       * Растр перекрашивается при отрисовке: устаревшие (под прежний отпечаток)
       * страницы рисуются заново при первой видимости. Пока область содержимого
       * скрыта (открыт раздел настроек), у неё нулевой размер — рисовать нечем,
       * и пересчёт окон откладывается до появления размера (сообщение `show` от
       * хоста или наблюдатель размера). */
      function repaintDirtyPages() {
        if (!doc) {
          return;
        }
        // Пытаемся перерисовать сразу (размер области уже мог вернуться) и
        // планируем пересчёт на кадр: если размер ещё не отдан раскладкой,
        // повторим в следующем кадре, а наблюдатель размера подстрахует.
        refreshWindows();
        scheduleWindowRefresh();
      }

      /** Пробуждение прокрутки области после возврата видимости.
       *
       * В WebKitGTK область, чей предок побывал в `display: none`, после
       * возврата может перестать считаться прокручиваемой, хотя содержимое выше
       * окна: колесо прокручивает документ, а не страницу. Явная переустановка
       * `overflow` заставляет движок пересчитать прокручиваемое переполнение;
       * положение прокрутки при этом сохраняется. */
      function wakeViewerScroll() {
        const overflow = viewer.style.overflow;
        viewer.style.overflow = 'hidden';
        void viewer.offsetHeight;
        viewer.style.overflow = overflow;
      }

      /** Разбор цвета вида `#rrggbb`; неподходящее значение даёт null. */
      function parseHexColor(value) {
        if (typeof value !== 'string') {
          return null;
        }
        const match = /^#?([0-9a-f]{6})$/i.exec(value.trim());
        if (!match) {
          return null;
        }
        const number = Number.parseInt(match[1], 16);
        return { r: (number >> 16) & 255, g: (number >> 8) & 255, b: number & 255 };
      }

      /** Цвета перекраски страницы: куда уходит белая бумага и чёрный текст.
       *
       * Задаются темой; без них берётся нейтральная светлая бумага, чтобы
       * страница всё равно не осталась белой. */
      let pageColors = createPageColors(null);

      /** Сборка целей перекраски из присланного значения темы. */
      function createPageColors(value) {
        const paper = parseHexColor(value && value.paper) || { r: 0x3f, g: 0x3b, b: 0x38 };
        const ink = parseHexColor(value && value.ink) || { r: 0xd5, g: 0xc4, b: 0xa1 };
        return {
          paper,
          ink,
          paperCss: `rgb(${paper.r}, ${paper.g}, ${paper.b})`,
          inkCss: `rgb(${ink.r}, ${ink.g}, ${ink.b})`,
        };
      }

      /** Перекраска растра страницы под тёмную тему области чтения.
       *
       * Тёмный текст страницы уходит в светлый цвет темы (`ink`), белая бумага —
       * в тёмный цвет темы (`paper`): цвет страницы следует палитре, а не
       * нейтральному чёрному. Каждый канал движется пропорционально своей
       * яркости линейно между точками «чёрный → ink» и «белый → paper», поэтому
       * цветной оттенок содержимого сохраняется (графика и иллюстрации темнеют,
       * но остаются узнаваемыми). При светлой теме растр не трогается.
       */
      function recolorCanvas(canvas) {
        if (readerTheme !== 'dark') {
          return;
        }
        const context = canvas.getContext('2d');
        if (!context || !canvas.width || !canvas.height) {
          return;
        }
        let image;
        try {
          image = context.getImageData(0, 0, canvas.width, canvas.height);
        } catch (error) {
          // Песочница может запретить чтение пикселей: тогда страница остаётся
          // как есть, но тема не ломает отрисовку.
          return;
        }
        const data = image.data;
        const { paper, ink } = pageColors;
        for (let offset = 0; offset < data.length; offset += 4) {
          const luminance =
            0.299 * data[offset] + 0.587 * data[offset + 1] + 0.114 * data[offset + 2];
          // Доли близости пикселя к чёрному (0) и к белому (255).
          const inkWeight = 1 - luminance / 255;
          const paperWeight = luminance / 255;
          // Оттенок пикселя: насколько каналы отличаются от его яркости.
          data[offset] = clampByte(
            ink.r * inkWeight + paper.r * paperWeight + (data[offset] - luminance),
          );
          data[offset + 1] = clampByte(
            ink.g * inkWeight + paper.g * paperWeight + (data[offset + 1] - luminance),
          );
          data[offset + 2] = clampByte(
            ink.b * inkWeight + paper.b * paperWeight + (data[offset + 2] - luminance),
          );
        }
        context.putImageData(image, 0, 0);
      }

      /** Ограничение значения канала диапазоном 0–255. */
      function clampByte(value) {
        if (value <= 0) {
          return 0;
        }
        if (value >= 255) {
          return 255;
        }
        return value;
      }

      /** Разбор геометрии фигуры: две точки в долях страницы. */
      function parseGeometry(value) {
        let geometry;
        try {
          geometry = JSON.parse(value || '');
        } catch (error) {
          return null;
        }
        if (!geometry || typeof geometry !== 'object') {
          return null;
        }
        const coordinates = [geometry.x1, geometry.y1, geometry.x2, geometry.y2];
        if (!coordinates.every((number) => typeof number === 'number' && isFinite(number))) {
          return null;
        }
        return {
          x1: geometry.x1,
          y1: geometry.y1,
          x2: geometry.x2,
          y2: geometry.y2,
        };
      }

      /** Создание SVG-элемента фигуры по её виду и геометрии. */
      function shapeElement(shape, geometry) {
        const namespace = 'http://www.w3.org/2000/svg';
        const { x1, y1, x2, y2 } = geometry;
        if (shape === 'rectangle') {
          const rect = document.createElementNS(namespace, 'rect');
          rect.setAttribute('x', String(Math.min(x1, x2)));
          rect.setAttribute('y', String(Math.min(y1, y2)));
          rect.setAttribute('width', String(Math.abs(x2 - x1)));
          rect.setAttribute('height', String(Math.abs(y2 - y1)));
          return rect;
        }
        if (shape === 'ellipse') {
          const ellipse = document.createElementNS(namespace, 'ellipse');
          ellipse.setAttribute('cx', String((x1 + x2) / 2));
          ellipse.setAttribute('cy', String((y1 + y2) / 2));
          ellipse.setAttribute('rx', String(Math.abs(x2 - x1) / 2));
          ellipse.setAttribute('ry', String(Math.abs(y2 - y1) / 2));
          return ellipse;
        }
        const line = document.createElementNS(namespace, 'line');
        line.setAttribute('x1', String(x1));
        line.setAttribute('y1', String(y1));
        line.setAttribute('x2', String(x2));
        line.setAttribute('y2', String(y2));
        return line;
      }

      /** Создание прозрачной широкой мишени по контуру фигуры (`<path>`).
       *
       * Тонкая видимая линия почти не кликается, поэтому рядом с фигурой кладётся
       * прозрачная обводка по тому же контуру. Тип `path` выбран, чтобы не
       * добавлять в разметку вторые `line`/`rect`/`ellipse` и не ломать подсчёты.
       */
      function shapeHitElement(shape, geometry) {
        const namespace = 'http://www.w3.org/2000/svg';
        const { x1, y1, x2, y2 } = geometry;
        let data;
        if (shape === 'rectangle') {
          const left = Math.min(x1, x2);
          const top = Math.min(y1, y2);
          const right = Math.max(x1, x2);
          const bottom = Math.max(y1, y2);
          data = `M${left} ${top}H${right}V${bottom}H${left}Z`;
        } else if (shape === 'ellipse') {
          const cx = (x1 + x2) / 2;
          const cy = (y1 + y2) / 2;
          const rx = Math.abs(x2 - x1) / 2;
          const ry = Math.abs(y2 - y1) / 2;
          data =
            `M${cx - rx} ${cy}` +
            `A${rx} ${ry} 0 1 0 ${cx + rx} ${cy}` +
            `A${rx} ${ry} 0 1 0 ${cx - rx} ${cy}Z`;
        } else {
          data = `M${x1} ${y1}L${x2} ${y2}`;
        }
        const path = document.createElementNS(namespace, 'path');
        path.setAttribute('d', data);
        return path;
      }

      /** Подсветка заметок и наложения карточек и фигур на странице. */
      function drawNotes(pageEl) {
        const overlay = overlayOf(pageEl);
        if (!overlay) {
          return;
        }
        // Слой фигур сохраняется: во время протяжки по нему ведётся предпросмотр,
        // а замена содержимого разрушила бы захваченный указатель.
        overlay.querySelectorAll('.note, .note-card, .note-shape').forEach((element) =>
          element.remove(),
        );
        const index = Number(pageEl.dataset.page);
        for (const note of notes) {
          if (!note.anchor) {
            continue;
          }
          let anchor;
          try {
            anchor = JSON.parse(note.anchor);
          } catch (error) {
            continue;
          }
          // Черновик перемещения или сдвига границ подменяет сохранённое место.
          let geometry = note.geometry;
          let rects = anchor.rects || [];
          if (moveDrag && moveDrag.note.id === note.id) {
            anchor = moveDrag.draftAnchor || anchor;
            geometry = moveDrag.draftGeometry || geometry;
          }
          if (resizeDrag && resizeDrag.note.id === note.id && resizeDrag.draft) {
            rects = resizeDrag.draft;
          }
          // Цитаты привязаны к странице, карточки и фигуры — к точке на ней.
          if (!anchor || anchor.page !== index) {
            continue;
          }
          const type = note.type || 'quote';
          if (type === 'text' && anchor.kind === 'point') {
            drawTextCard(overlay, note, anchor);
          } else if (type === 'shape' && anchor.kind === 'point') {
            drawShape(overlay, note, anchor, geometry);
          } else if (anchor.kind === 'page') {
            for (const rect of lineRects(rects)) {
              const element = document.createElement('div');
              element.className = 'note';
              element.dataset.noteId = note.id;
              element.style.background = noteColor(note.color);
              element.style.left = rect.x * 100 + '%';
              element.style.top = rect.y * 100 + '%';
              element.style.width = rect.width * 100 + '%';
              element.style.height = rect.height * 100 + '%';
              overlay.appendChild(element);
            }
          }
        }
      }

      /** Наложение текстовой карточки по точке её якоря на странице. */
      function drawTextCard(overlay, note, anchor) {
        const element = document.createElement('div');
        element.className = 'note-card';
        element.dataset.noteId = note.id;
        element.style.left = anchor.x * 100 + '%';
        element.style.top = anchor.y * 100 + '%';
        // Карточка окрашена тем же мягким тоном, что цитата и фигура.
        element.style.background = noteColor(note.color);
        element.textContent = note.text || '';
        overlay.appendChild(element);
      }

      /** Наложение фигуры по её виду и геометрии на странице. */
      function drawShape(overlay, note, anchor, geometryValue) {
        const geometry = parseGeometry(geometryValue ?? note.geometry);
        if (!geometry) {
          return;
        }
        const namespace = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(namespace, 'svg');
        svg.setAttribute('class', 'note-shape');
        svg.setAttribute('viewBox', '0 0 1 1');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.dataset.noteId = note.id;
        const color = noteColor(note.color);
        const shape = note.shape || 'line';
        const element = shapeElement(shape, geometry);
        if (shape === 'line') {
          // Линия — толстый полупрозрачный штрих: заливки у неё нет.
          element.setAttribute('stroke', color);
          element.setAttribute('stroke-width', '4');
          element.setAttribute('fill', 'none');
        } else {
          // Прямоугольник и эллипс — мягкая заливка без обводки, как цитата.
          element.setAttribute('fill', color);
          element.setAttribute('stroke', 'none');
        }
        svg.appendChild(element);
        // Прозрачная мишень по всей фигуре: попасть по тонкому штриху сложно (см. CSS).
        const hit = shapeHitElement(shape, geometry);
        hit.setAttribute('class', 'note-shape-hit');
        svg.appendChild(hit);
        overlay.appendChild(svg);
      }

      /** Заметка по идентификатору из локального списка. */
      function noteById(noteId) {
        return notes.find((note) => note.id === noteId) || null;
      }

      /** Разбор якоря заметки; повреждённая строка даёт null. */
      function anchorOf(note) {
        if (!note || !note.anchor) {
          return null;
        }
        try {
          return JSON.parse(note.anchor);
        } catch (error) {
          return null;
        }
      }

      /** Закрытие контекстного меню заметки: снимается состояние и меню оболочки. */
      function closeNoteMenu() {
        if (noteMenu) {
          post({ type: 'note-menu-close' });
        }
        noteMenu = null;
      }

      /** Снятие направляющих перемещения. */
      function clearMoveGuide() {
        if (moveGuide) {
          moveGuide.remove();
          moveGuide = null;
        }
      }

      /** Элемент заметки для рамки направляющих: карточка, фигура или подсветка. */
      function noteElement(noteId) {
        const { element } = locateNote(noteId);
        if (!element) {
          return null;
        }
        if (element.classList.contains('note-shape')) {
          return element.querySelector('line,rect,ellipse');
        }
        return element;
      }

      /** Показ направляющих перемещения вокруг выбранной заметки. */
      function showMoveGuide() {
        clearMoveGuide();
        if (!moveDrag) {
          return;
        }
        const { overlay, pageEl } = locateNote(moveDrag.note.id);
        const target = noteElement(moveDrag.note.id);
        if (!overlay || !pageEl || !target) {
          return;
        }
        const bounds = pageEl.getBoundingClientRect();
        const rect = target.getBoundingClientRect();
        const guide = document.createElement('div');
        guide.className = 'note-move-guide';
        guide.dataset.guide = 'move';
        guide.style.left = rect.left - bounds.left + 'px';
        guide.style.top = rect.top - bounds.top + 'px';
        guide.style.width = rect.width + 'px';
        guide.style.height = rect.height + 'px';
        overlay.appendChild(guide);
        moveGuide = guide;
      }

      /** Сообщение оболочке об открытии или закрытии меню заметки.
       *
       * Собственную копию меню плагин не строит: меню принадлежит оболочке и
       * общее для всех режимов чтения. Плагин лишь сообщает прямоугольник
       * заметки в координатах области чтения, а команды перемещения и правки
       * границ приходят обратно сообщением `note-menu-action`.
       */
      function openNoteMenu(note, element) {
        // У фигуры наложение — SVG во всю страницу; для привязки меню берётся
        // её графический элемент, иначе меню уезжает к низу страницы.
        const graphic = element.querySelector('line,rect,ellipse') || element;
        const rect = graphic.getBoundingClientRect();
        noteMenu = { noteId: note.id, noteType: note.type || 'quote' };
        post({
          type: 'note-menu',
          value: {
            noteId: note.id,
            noteType: noteMenu.noteType,
            left: rect.left,
            top: rect.top,
            bottom: rect.bottom,
          },
        });
      }

      /** Сообщение приложению о новом размещении заметки. */
      function placeNote(note, anchor, geometry) {
        note.anchor = JSON.stringify(anchor);
        if (geometry !== undefined) {
          note.geometry = geometry;
        }
        const value = { noteId: note.id, anchor };
        if (geometry !== undefined) {
          value.geometry = geometry;
        }
        post({ type: 'place-note', value });
        redrawAllNotes();
      }

      /** Включение режима перемещения заметки. */
      function startMove(note) {
        const anchor = anchorOf(note);
        if (!anchor) {
          return;
        }
        /* Отмена незавершённой протяжки: клик по пункту меню под инструментом
           фигуры/текста иначе превратился бы в рисование и захватил указатель. */
        cancelShapeDrag();
        moveDrag = {
          note,
          anchor,
          geometry: parseGeometry(note.geometry),
        };
        editing = { noteId: note.id, mode: 'move' };
        document.body.dataset.editing = 'move';
        showMoveGuide();
      }

      /** Включение режима правки границ цитаты в PDF (по тексту страницы).
       *
       * Анкер цитаты хранит прямоугольники, а не смещения текста. Чтобы тянуть
       * границы по символам, концы выделения восстанавливаются как позиции
       * каретки в текстовом слое, а прямоугольники строятся из диапазона между
       * ними; сами прямоугольники напрямую не двигаются.
       */
      function startResize(note) {
        const anchor = anchorOf(note);
        if (!anchor || !anchor.rects || anchor.rects.length === 0) {
          return;
        }
        const { pageEl } = locateNote(note.id);
        resizeDrag = { note, anchor, edge: 'start' };
        editing = { noteId: note.id, mode: 'resize' };
        // Слой подсветок перестаёт перехватывать указатель (см. CSS), и только
        // затем концы цитаты восстанавливаются как каретки по тексту.
        document.body.dataset.editing = 'resize';
        if (pageEl) {
          const caret = resolveResizeCarets(anchor, pageEl);
          if (caret) {
            resizeDrag.pageEl = pageEl;
            resizeDrag.startCaret = caret.start;
            resizeDrag.endCaret = caret.end;
          }
        }
        redrawAllNotes();
        renderResizeHandles();
      }

      /** Крайние прямоугольники цитаты: первый и последний по порядку чтения. */
      function edgeRects(rects) {
        const sorted = (rects || []).slice().sort((a, b) => a.y - b.y || a.x - b.x);
        if (sorted.length === 0) {
          return null;
        }
        return { first: sorted[0], last: sorted[sorted.length - 1] };
      }

      /** Позиция каретки в текстовом слое страницы по координатам указателя. */
      function caretAtPoint(pageEl, clientX, clientY) {
        const bounds = pageEl.getBoundingClientRect();
        const pointX = Math.max(bounds.left + 1, Math.min(bounds.right - 1, clientX));
        const pointY = Math.max(bounds.top + 1, Math.min(bounds.bottom - 1, clientY));
        const caretRangeFromPoint = document.caretRangeFromPoint
          ? document.caretRangeFromPoint.bind(document)
          : document.caretPositionFromPoint
            ? (x, y) => {
                const position = document.caretPositionFromPoint(x, y);
                if (!position) {
                  return null;
                }
                const range = document.createRange();
                range.setStart(position.offsetNode, position.offset);
                range.setEnd(position.offsetNode, position.offset);
                return range;
              }
            : null;
        const range = caretRangeFromPoint ? caretRangeFromPoint(pointX, pointY) : null;
        if (!range) {
          return null;
        }
        const layer = elementOf(range.startContainer)?.closest('.textLayer');
        if (!layer || !pageEl.contains(layer)) {
          return null;
        }
        return { node: range.startContainer, offset: range.startOffset, layer };
      }

      /** Диапазон между двумя позициями каретки независимо от их порядка. */
      function rangeBetweenCarets(startCaret, endCaret) {
        const build = (from, to) => {
          const range = document.createRange();
          try {
            range.setStart(from.node, from.offset);
            range.setEnd(to.node, to.offset);
          } catch (error) {
            return null;
          }
          return range.toString().length > 0 ? range : null;
        };
        return build(startCaret, endCaret) || build(endCaret, startCaret);
      }

      /** Восстановление концов цитаты как кареток по её крайним прямоугольникам. */
      function resolveResizeCarets(anchor, pageEl) {
        const edges = edgeRects(anchor.rects);
        if (!edges) {
          return null;
        }
        const bounds = pageEl.getBoundingClientRect();
        const start = caretAtPoint(
          pageEl,
          bounds.left + edges.first.x * bounds.width + 1,
          bounds.top + (edges.first.y + edges.first.height / 2) * bounds.height,
        );
        const end = caretAtPoint(
          pageEl,
          bounds.left + (edges.last.x + edges.last.width) * bounds.width - 1,
          bounds.top + (edges.last.y + edges.last.height / 2) * bounds.height,
        );
        return start && end ? { start, end } : null;
      }

      /** Поиск наложения и страницы для заметки по её идентификатору. */
      function locateNote(noteId) {
        const element = document.querySelector(`[data-note-id="${noteId}"]`);
        const pageEl = element ? element.closest('.page') : null;
        const overlay = pageEl ? overlayOf(pageEl) : null;
        return { element, pageEl, overlay };
      }

      /** Выход из режима правки заметки. */
      function stopEditing() {
        editing = null;
        moveDrag = null;
        resizeDrag = null;
        clearMoveGuide();
        delete document.body.dataset.editing;
        renderResizeHandles();
      }

      /** Отрисовка маркеров границ цитаты в PDF. */
      function renderResizeHandles() {
        document.querySelectorAll('.note-handle').forEach((handle) => handle.remove());
        if (!editing || editing.mode !== 'resize' || !resizeDrag) {
          return;
        }
        const rects =
          resizeDrag.draft ||
          (resizeDrag.anchor ? resizeDrag.anchor.rects : null);
        const { overlay, pageEl } =
          resizeDrag.pageEl && resizeDrag.pageEl.isConnected
            ? { pageEl: resizeDrag.pageEl, overlay: overlayOf(resizeDrag.pageEl) }
            : locateNote(resizeDrag.note.id);
        if (!overlay || !pageEl) {
          return;
        }
        const edges = edgeRects(rects);
        if (!edges) {
          return;
        }
        const bounds = pageEl.getBoundingClientRect();
        const place = (edge, rect, x) => {
          const handle = document.createElement('div');
          handle.className = 'note-handle';
          handle.dataset.noteHandle = edge;
          handle.style.left = x - bounds.left + 'px';
          handle.style.top = rect.y * bounds.height + (rect.height * bounds.height) / 2 + 'px';
          overlay.appendChild(handle);
        };
        place('start', edges.first, bounds.left + edges.first.x * bounds.width);
        place(
          'end',
          edges.last,
          bounds.left + (edges.last.x + edges.last.width) * bounds.width,
        );
      }

      function redrawAllNotes() {
        for (const pageEl of pagesEl.children) {
          drawNotes(pageEl);
        }
      }

      /** Страница, находящаяся у верха области чтения. */
      function pageAtTop() {
        const top = viewer.scrollTop;
        let result = 1;
        for (const pageEl of pagesEl.children) {
          const offset = pageEl.offsetTop;
          if (offset <= top + 8) {
            result = Number(pageEl.dataset.page);
          } else {
            break;
          }
        }
        return result;
      }

      /** Обновление текущей страницы и прогресса после прокрутки. */
      function handleScroll() {
        if (!doc || scheduled) {
          return;
        }
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          const page = pageAtTop();
          if (page !== currentPage) {
            currentPage = page;
          }
          reportState();
          scheduleWindowRefresh();
          if (moveGuide) {
            showMoveGuide();
          }
        });
      }

      /** Прокрутка к доле книги в процентах. */
      function scrollToFraction(percent) {
        const max = viewer.scrollHeight - viewer.clientHeight;
        viewer.scrollTop = max * (Math.max(0, Math.min(100, percent)) / 100);
      }

      /** Прокрутка к странице (постраничный режим помещает её в область видимости). */
      function gotoPage(page) {
        const target = Math.max(1, Math.min(pageCount, Math.trunc(page)));
        const pageEl = pagesEl.children[target - 1];
        if (pageEl) {
          pageEl.scrollIntoView({ block: 'start' });
          currentPage = target;
          reportState();
          scheduleWindowRefresh();
        }
      }

      /** Прокрутка к самой заметке: её полоса оказывается у верха области.
       *
       * Прокрутка идёт к элементу заметки, а не к началу страницы: при
       * увеличенной странице цитата внизу страницы иначе оставалась бы за
       * экраном. Заметка может быть ещё не нарисована (страница при переходе
       * рендерится заново) — тогда прокрутка повторяется, пока элемент не
       * появится. Направление прокрутки учитывается, чтобы область чтения
       * смещалась именно в сторону заметки.
       */
      function gotoNote(noteId, attempt = 0) {
        if (!noteId) {
          return;
        }
        const element = document.querySelector(`[data-note-id="${noteId}"]`);
        const pageEl = element ? element.closest('.page') : null;
        if (!element || !pageEl) {
          if (attempt < 40) {
            setTimeout(() => gotoNote(noteId, attempt + 1), 50);
          }
          return;
        }
        const viewerBounds = viewer.getBoundingClientRect();
        const target =
          element.classList.contains('note-shape')
            ? element.querySelector('line,rect,ellipse') || element
            : element;
        const bounds = target.getBoundingClientRect();
        // Полоса заметки — на строку ниже верха области: она видна, но над ней
        // остаётся контекст соседних строк.
        const offset = Math.round(bounds.height);
        const delta = bounds.top - viewerBounds.top - offset;
        if (delta !== 0) {
          viewer.scrollTop += delta;
        }
        const page = Number(pageEl.dataset.page);
        if (Number.isFinite(page)) {
          currentPage = page;
          reportState();
        }
        scheduleWindowRefresh();
        flashNote(noteId);
      }

      /** Вспышка заметки при переходе из списка.
       *
       * Заметка может быть ещё не нарисована: страница при переходе рендерится
       * заново. Тогда вспышка повторяется, пока её элемент не появится, иначе
       * мигала бы сама страница, а не заметка.
       */
      function flashNote(noteId, attempt = 0) {
        if (!noteId) {
          return;
        }
        const elements = document.querySelectorAll(`[data-note-id="${noteId}"]`);
        if (elements.length === 0) {
          if (attempt < 40) {
            setTimeout(() => flashNote(noteId, attempt + 1), 50);
          }
          return;
        }
        for (const element of elements) {
          element.dataset.flash = 'true';
          setTimeout(() => {
            delete element.dataset.flash;
          }, 300);
        }
      }

      async function open(data, position, zoomValue) {
        status.textContent = 'Открытие книги…';
        status.hidden = false;
        pagesEl.replaceChildren();
        // Предыдущая книга: освобождаем её холсты, иначе карта держала бы их.
        rendered.clear();
        pending.clear();
        renderEpoch += 1;
        try {
          const lib = await loadEngine();
          doc = await lib.getDocument({ data: decodeBase64(data) }).promise;
          pageCount = doc.numPages;
          initialZoom = Number(zoomValue) || 100;
          zoom = initialZoom;
          const first = await doc.getPage(1);
          const firstBase = first.getViewport({ scale: 1 });
          naturalSizes = new Array(pageCount).fill({
            width: firstBase.width,
            height: firstBase.height,
          });
          layoutPages();
          startObserver();
          status.hidden = true;
          scrollToFraction(position);
          currentPage = pageAtTop();
          reportState();
        } catch (error) {
          status.textContent = 'Не удалось отобразить книгу: ' + error;
          post({ type: 'error', message: String(error) });
        }
      }

      /** Применение масштаба с удержанием опорной страницы на месте. */
      function applyZoom(value) {
        if (!doc) {
          return;
        }
        const next = Number(value) || 100;
        if (next === zoom) {
          return;
        }
        const anchorEl = pagesEl.children[currentPage - 1];
        const offsetBefore = anchorEl ? anchorEl.offsetTop - viewer.scrollTop : 0;
        zoom = next;
        // Смена масштаба отменяет незавершённые отрисовки: иначе они завершатся
        // в старом масштабе и оставят страницу белой.
        renderEpoch += 1;
        resizePages();
        for (const pageEl of pagesEl.children) {
          releasePage(pageEl);
        }
        for (const pageEl of pagesEl.children) {
          const rect = pageEl.getBoundingClientRect();
          if (rect.bottom > -1200 && rect.top < window.innerHeight + 1200) {
            void renderPage(pageEl);
          }
        }
        if (anchorEl) {
          viewer.scrollTop = anchorEl.offsetTop - offsetBefore;
        }
        reportState();
      }

      /** Доля выделения в долях размера страницы. */
      function fractionRect(bounds, pageBounds) {
        return {
          x: (bounds.left - pageBounds.left) / pageBounds.width,
          y: (bounds.top - pageBounds.top) / pageBounds.height,
          width: bounds.width / pageBounds.width,
          height: bounds.height / pageBounds.height,
        };
      }

      /** Группы-строки выделения по прямоугольникам диапазона.
       *
       * Куски одной строки объединяются по заметному вертикальному перекрытию, но
       * верх/низ групп НЕ подрезаются друг под друга: заливку рисует единая маска
       * по сырым прямоугольникам, поэтому перекрытие строк по высоте не темнеет,
       * а полоса совпадает с тем, что подсветил бы браузер (как в официальном
       * просмотрщике pdf.js) и не режет буквы посередине. Группы нужны только
       * для вертикальных меток по краям всего выделения и для якоря заметки. */
      function selectionBands(rects) {
        const items = (rects || [])
          .filter((rect) => rect.width > 0 && rect.height > 0)
          .sort(
            (a, b) => a.y + a.height / 2 - (b.y + b.height / 2) || a.x - b.x,
          );
        const lines = [];
        for (const rect of items) {
          const line = lines[lines.length - 1];
          if (line) {
            const overlap =
              Math.min(line.bottom, rect.y + rect.height) - Math.max(line.top, rect.y);
            const minHeight = Math.min(line.bottom - line.top, rect.height);
            // Заметное вертикальное перекрытие — та же строка, сливаем её куски.
            if (overlap > minHeight * 0.5) {
              line.top = Math.min(line.top, rect.y);
              line.bottom = Math.max(line.bottom, rect.y + rect.height);
              line.x = Math.min(line.x, rect.x);
              line.right = Math.max(line.right, rect.x + rect.width);
              continue;
            }
          }
          lines.push({
            top: rect.y,
            bottom: rect.y + rect.height,
            x: rect.x,
            right: rect.x + rect.width,
          });
        }
        return lines
          .filter((line) => line.right > line.x && line.bottom > line.top)
          .map((line) => ({
            x: line.x,
            y: line.top,
            width: line.right - line.x,
            height: line.bottom - line.top,
          }));
      }

      /** Прямоугольники диапазона в долях страницы, заданные `Range`. */
      function selectionRects(range, pageBounds) {
        const rects = [];
        for (const bounds of range.getClientRects()) {
          if (bounds.width <= 0 || bounds.height <= 0) {
            continue;
          }
          rects.push(fractionRect(bounds, pageBounds));
        }
        return rects;
      }

      /** Маска заливки выделения: единый `clipPath` по прямоугольникам диапазона.
       *
       * Перекрывающиеся части строк объединяются одним контуром с правилом
       * `nonzero`, поэтому заливка на стыках не темнеет, а полоса не сужается до
       * середины букв. SVG лежит внутри заливаемого элемента, а `clipPath` задан в
       * долях его рамки (`objectBoundingBox`) — то есть в долях страницы. */
      function applyFillMask(fill, rects) {
        const namespace = 'http://www.w3.org/2000/svg';
        selectionClipId += 1;
        const id = 'selection-clip-' + selectionClipId;
        const svg = document.createElementNS(namespace, 'svg');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('width', '100%');
        svg.setAttribute('height', '100%');
        const clip = document.createElementNS(namespace, 'clipPath');
        clip.setAttribute('id', id);
        clip.setAttribute('clipPathUnits', 'objectBoundingBox');
        const path = document.createElementNS(namespace, 'path');
        path.setAttribute('d', rects
          .map((rect) => `M${rect.x} ${rect.y}h${rect.width}v${rect.height}h-${rect.width}Z`)
          .join(' '));
        clip.append(path);
        svg.append(clip);
        fill.style.clipPath = `url(#${id})`;
        fill.append(svg);
      }

      /** Перерисовка слоя выделения по текущему выделению текста.
       *
       * Заливка — единый элемент во всю страницу, обрезанный маской по сырым
       * прямоугольникам диапазона (`Range.getClientRects`), как в официальном
       * просмотрщике pdf.js: перекрытие строк по высоте не темнеет на стыках, а
       * полоса совпадает с нативным выделением и не режет буквы. Вертикальные
       * метки («курсоры») ставятся только у краёв всего выделения — по группам
       * строк. Заливка ложится умножением (на тёмной стороне — осветлением), растр
       * текста остаётся чётким. Само нативное выделение прозрачно и служит
       * копированию. */
      function renderSelection() {
        // Слой выделения всегда один: снимаем прежний, не перебирая страницы.
        for (const stale of document.querySelectorAll('.selection-layer')) {
          stale.remove();
        }
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
          return;
        }
        const range = selection.getRangeAt(0);
        const startLayer = elementOf(range.startContainer)?.closest('.textLayer');
        const endLayer = elementOf(range.endContainer)?.closest('.textLayer');
        if (!startLayer || startLayer !== endLayer) {
          return;
        }
        const pageEl = startLayer.closest('.page');
        const overlay = pageEl ? overlayOf(pageEl) : null;
        if (!pageEl || !overlay) {
          return;
        }
        const pageBounds = pageEl.getBoundingClientRect();
        const rects = selectionRects(range, pageBounds);
        if (rects.length === 0) {
          return;
        }
        const bands = selectionBands(rects);
        const layer = document.createElement('div');
        layer.className = 'selection-layer';
        const fill = document.createElement('div');
        fill.className = 'selection-fill';
        applyFillMask(fill, rects);
        layer.append(fill);
        bands.forEach((rect, index) => {
          const band = document.createElement('div');
          band.className = 'selection-band';
          band.style.left = rect.x * 100 + '%';
          band.style.top = rect.y * 100 + '%';
          band.style.width = rect.width * 100 + '%';
          band.style.height = rect.height * 100 + '%';
          // Метки — только у краёв всего выделения: левая в его начале, правая в
          // конце. У промежуточных строк меток нет, иначе они читаются как
          // отдельные выделения (особенно при строках разной длины).
          const isStart = index === 0;
          const isEnd = index === bands.length - 1;
          band.dataset.edge = isStart && isEnd ? 'both' : isStart ? 'start' : isEnd ? 'end' : 'none';
          layer.append(band);
        });
        // Слой лежит поверх канваса, но под оверлеем заметок.
        pageEl.insertBefore(layer, overlay);
      }

      function handleSelection() {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
          return;
        }
        const range = selection.getRangeAt(0);
        const startLayer = elementOf(range.startContainer)?.closest('.textLayer');
        const endLayer = elementOf(range.endContainer)?.closest('.textLayer');
        if (!startLayer || startLayer !== endLayer) {
          return;
        }
        const pageEl = startLayer.closest('.page');
        if (!pageEl) {
          return;
        }
        const quote = selection.toString().replace(/\s+/g, ' ').trim();
        if (!quote) {
          return;
        }
        const pageBounds = pageEl.getBoundingClientRect();
        const rects = selectionRects(range, pageBounds);
        if (rects.length === 0) {
          return;
        }
        const first = range.getClientRects()[0];
        const page = Number(pageEl.dataset.page);
        post({
          type: 'selection',
          value: {
            anchor: {
              v: 1,
              kind: 'page',
              chapter: 0,
              start: 0,
              end: 0,
              quote,
              percent: scrollProgress(),
              page,
              rects,
            },
            x: first.left,
            y: first.bottom,
          },
        });
      }

      function elementOf(node) {
        return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      }

      /** Доли точки внутри страницы по координатам указателя. */
      function pointFraction(pageEl, clientX, clientY) {
        const bounds = pageEl.getBoundingClientRect();
        const x = bounds.width > 0 ? (clientX - bounds.left) / bounds.width : 0;
        const y = bounds.height > 0 ? (clientY - bounds.top) / bounds.height : 0;
        return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
      }

      /** Страница под координатами указателя. */
      function pageAt(clientX, clientY) {
        const element = document.elementFromPoint(clientX, clientY);
        return element && element.closest ? element.closest('.page') : null;
      }

      /** Начало тяги перемещения заметки (карточки или фигуры). */
      function beginMoveDrag(event) {
        if (!moveDrag) {
          return false;
        }
        const { pageEl } = locateNote(moveDrag.note.id);
        if (!pageEl) {
          return false;
        }
