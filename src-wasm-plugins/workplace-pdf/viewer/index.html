        const bounds = pageEl.getBoundingClientRect();
        moveDrag.startX = event.clientX;
        moveDrag.startY = event.clientY;
        moveDrag.width = bounds.width;
        moveDrag.height = bounds.height;
        moveDrag.pointerId = event.pointerId;
        try {
          pagesEl.setPointerCapture(event.pointerId);
        } catch (error) {
          /* Захват указателя может быть недоступен — не критично. */
        }
        event.preventDefault();
        return true;
      }

      /** Обновление перемещения заметки: живой сдвиг её элемента. */
      function moveNoteDrag(event) {
        if (!moveDrag || event.pointerId !== moveDrag.pointerId) {
          return;
        }
        const dx = moveDrag.width > 0 ? (event.clientX - moveDrag.startX) / moveDrag.width : 0;
        const dy = moveDrag.height > 0 ? (event.clientY - moveDrag.startY) / moveDrag.height : 0;
        const anchor = moveDrag.anchor;
        moveDrag.draftAnchor = {
          ...anchor,
          x: Math.max(0, Math.min(1, (anchor.x || 0) + dx)),
          y: Math.max(0, Math.min(1, (anchor.y || 0) + dy)),
        };
        if (moveDrag.geometry) {
          moveDrag.draftGeometry = JSON.stringify({
            x1: Math.max(0, Math.min(1, moveDrag.geometry.x1 + dx)),
            y1: Math.max(0, Math.min(1, moveDrag.geometry.y1 + dy)),
            x2: Math.max(0, Math.min(1, moveDrag.geometry.x2 + dx)),
            y2: Math.max(0, Math.min(1, moveDrag.geometry.y2 + dy)),
          });
        }
        redrawAllNotes();
        if (moveGuide) {
          showMoveGuide();
        }
      }

      /** Завершение перемещения заметки: сохранение нового места. */
      function finishMoveDrag(event) {
        if (!moveDrag || event.pointerId !== moveDrag.pointerId) {
          return false;
        }
        const drag = moveDrag;
        moveDrag = null;
        editing = null;
        clearMoveGuide();
        delete document.body.dataset.editing;
        const anchor = drag.draftAnchor || drag.anchor;
        placeNote(drag.note, anchor, drag.draftGeometry);
        editClickSuppress = true;
        return true;
      }

      /** Начало тяги границы цитаты в PDF. */
      function beginResizeDrag(event, edge) {
        if (!resizeDrag) {
          return;
        }
        resizeDrag.edge = edge;
        resizeDrag.pointerId = event.pointerId;
        try {
          pagesEl.setPointerCapture(event.pointerId);
        } catch (error) {
          /* Захват указателя может быть недоступен — не критично. */
        }
        event.preventDefault();
        event.stopPropagation();
      }

      /** Обновление границы цитаты: конец выделения переносится к символу под курсором.
       *
       * Прямоугольники не тянутся напрямую: по указателю находится позиция каретки
       * в текстовом слое, из пары кареток строится диапазон, а прямоугольники и
       * текст берутся из него. Так границы цитаты двигаются по тексту.
       */
      function moveResizeDrag(event) {
        if (!resizeDrag || event.pointerId !== resizeDrag.pointerId) {
          return;
        }
        const pageEl = resizeDrag.pageEl;
        if (!pageEl || !resizeDrag.startCaret || !resizeDrag.endCaret) {
          return;
        }
        const caret = caretAtPoint(pageEl, event.clientX, event.clientY);
        if (!caret) {
          return;
        }
        if (resizeDrag.edge === 'start') {
          resizeDrag.startCaret = caret;
        } else {
          resizeDrag.endCaret = caret;
        }
        const range = rangeBetweenCarets(resizeDrag.startCaret, resizeDrag.endCaret);
        if (!range) {
          return;
        }
        const pageBounds = pageEl.getBoundingClientRect();
        const rects = [];
        for (const bounds of range.getClientRects()) {
          if (bounds.width <= 0 || bounds.height <= 0) {
            continue;
          }
          rects.push(fractionRect(bounds, pageBounds));
        }
        if (rects.length === 0) {
          return;
        }
        resizeDrag.draft = lineRects(rects);
        resizeDrag.draftQuote = range.toString().replace(/\s+/g, ' ').trim();
        redrawAllNotes();
        renderResizeHandles();
      }

      /** Завершение тяги границы цитаты: сохранение новых прямоугольников и текста. */
      function finishResizeDrag(event) {
        if (!resizeDrag || event.pointerId !== resizeDrag.pointerId) {
          return;
        }
        const drag = resizeDrag;
        resizeDrag = null;
        editing = null;
        delete document.body.dataset.editing;
        if (drag.draft) {
          const anchor = { ...drag.anchor, rects: drag.draft };
          if (drag.draftQuote) {
            anchor.quote = drag.draftQuote;
          }
          placeNote(drag.note, anchor);
        }
        renderResizeHandles();
        editClickSuppress = true;
        return true;
      }

      /** Отмена незавершённой протяжки фигуры со снятием предпросмотра. */
      function cancelShapeDrag() {
        if (shapeDrag && shapeDrag.preview) {
          shapeDrag.preview.remove();
        }
        shapeDrag = null;
      }

      /** Начало протяжки фигуры: запоминается первая точка и предпросмотр. */
      function startShapeDrag(event) {
        if (moveDrag && beginMoveDrag(event)) {
          return;
        }
        if (resizeDrag) {
          const handle = event.target.closest ? event.target.closest('[data-note-handle]') : null;
          if (handle) {
            beginResizeDrag(event, handle.dataset.noteHandle);
          }
          return;
        }
        /* Клик по пункту меню заметки не начинает рисование: иначе кнопки меню
           (особенно «Переместить») не срабатывали, а указатель захватывался
           протяжкой. */
        if (event.target.closest && event.target.closest('.note-menu')) {
          return;
        }
        // Клик по существующей заметке не создаёт новую.
        const onNote = event.target.closest ? event.target.closest('[data-note-id]') : null;
        if (onNote) {
          return;
        }
        if (tool.type !== 'shape' || event.button !== 0) {
          return;
        }
        const pageEl = pageAt(event.clientX, event.clientY);
        const overlay = pageEl ? overlayOf(pageEl) : null;
        if (!pageEl || !overlay) {
          return;
        }
        const start = pointFraction(pageEl, event.clientX, event.clientY);
        const preview = document.createElement('div');
        preview.className = 'note-preview';
        overlay.appendChild(preview);
        shapeDrag = { pageEl, start, current: { ...start }, preview, pointerId: event.pointerId };
        try {
          pagesEl.setPointerCapture(event.pointerId);
        } catch (error) {
          /* Захват указателя может быть недоступен — не критично. */
        }
        event.preventDefault();
      }

      /** Обновление предпросмотра во время протяжки. */
      function moveShapeDrag(event) {
        if (!shapeDrag || event.pointerId !== shapeDrag.pointerId) {
          return;
        }
        const current = pointFraction(shapeDrag.pageEl, event.clientX, event.clientY);
        shapeDrag.current = current;
        const { start, preview } = shapeDrag;
        preview.style.left = Math.min(start.x, current.x) * 100 + '%';
        preview.style.top = Math.min(start.y, current.y) * 100 + '%';
        preview.style.width = Math.abs(current.x - start.x) * 100 + '%';
        preview.style.height = Math.abs(current.y - start.y) * 100 + '%';
      }

      /** Завершение жеста: создание фигуры или точки текстовой карточки. */
      function finishGesture(event) {
        if (finishMoveDrag(event)) {
          return;
        }
        if (finishResizeDrag(event)) {
          return;
        }
        if (shapeDrag && event.pointerId === shapeDrag.pointerId) {
          const { pageEl, start, current, preview } = shapeDrag;
          shapeDrag = null;
          preview.remove();
          const moved =
            Math.abs(current.x - start.x) > 0.005 || Math.abs(current.y - start.y) > 0.005;
          if (moved) {
            const page = Number(pageEl.dataset.page);
            post({
              type: 'shape',
              value: {
                anchor: {
                  v: 1,
                  kind: 'point',
                  chapter: 0,
                  start: 0,
                  end: 0,
                  quote: '',
                  percent: scrollProgress(),
                  page,
                  x: start.x,
                  y: start.y,
                },
                shape: tool.shape,
                geometry: JSON.stringify({
                  x1: start.x,
                  y1: start.y,
                  x2: current.x,
                  y2: current.y,
                }),
                color: tool.color,
              },
            });
          }
          return;
        }
        if (tool.type === 'text' && event.button === 0) {
          /* Клик по пункту меню заметки (в том числе «Переместить») не создаёт
             карточку: кнопка меню не является частью элемента заметки. */
          if (event.target.closest && event.target.closest('.note-menu')) {
            return;
          }
          const onNote = event.target.closest ? event.target.closest('[data-note-id]') : null;
          if (onNote) {
            return;
          }
          const pageEl = pageAt(event.clientX, event.clientY);
          if (!pageEl) {
            return;
          }
          const point = pointFraction(pageEl, event.clientX, event.clientY);
          post({
            type: 'text-point',
            value: {
              anchor: {
                v: 1,
                kind: 'point',
                chapter: 0,
                start: 0,
                end: 0,
                quote: '',
                percent: scrollProgress(),
                page: Number(pageEl.dataset.page),
                x: point.x,
                y: point.y,
              },
              color: tool.color,
            },
          });
        }
      }

      /** Инструмент не «цитата»: выделение текста не начинается. */
      function handlePointerDown(event) {
        if (editing) {
          return;
        }
        if (tool.type !== 'quote') {
          event.preventDefault();
        }
      }

      /** Выделение цитаты выполняется только инструментом «цитата». */
      function handleSelectionOrGesture(event) {
        if (editing) {
          return;
        }
        if (tool.type === 'quote') {
          handleSelection();
        }
      }

      /** Снятие меню при пропаже выделения и перерисовка слоя выделения. */
      function handleSelectionChange() {
        // Слой выделения ведётся по текущему выделению: он перерисовывается на
        // каждое изменение, поэтому при снятии выделения слой исчезает.
        renderSelection();
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) {
          post({ type: 'selection-cleared' });
        }
      }

      addEventListener('message', async (event) => {
        const message = event.data;
        if (!message || message.channel !== CHANNEL) {
          return;
        }
        if (message.type === 'open') {
          await open(message.data, Number(message.position) || 0, message.zoom);
        } else if (message.type === 'zoom') {
          applyZoom(message.value);
        } else if (message.type === 'goto') {
          // Переход к заметке из списка закрывает меню и правку прежней заметки.
          closeNoteMenu();
          stopEditing();
          const value = message.value || {};
          let anchor = null;
          if (typeof value.anchor === 'string') {
            try {
              anchor = JSON.parse(value.anchor);
            } catch (error) {
              anchor = null;
            }
          }
          if (typeof value.noteId === 'string' && value.noteId) {
            // Сперва страница заметки (нужно для неотрисованных страниц), затем
            // прокрутка к самой заметке: с начала страницы цитата внизу при
            // увеличенной странице осталась бы за экраном.
            if (anchor && anchor.page) {
              gotoPage(anchor.page);
            }
            gotoNote(value.noteId);
          } else if (typeof value.page === 'number') {
            gotoPage(value.page);
          } else if (anchor && anchor.page) {
            gotoPage(anchor.page);
          }
        } else if (message.type === 'note-menu-action') {
          // Команда меню оболочки: перемещение заметки или правка границ цитаты.
          const value = message.value || {};
          const note = value.noteId ? noteById(value.noteId) : null;
          closeNoteMenu();
          if (!note) {
            return;
          }
          if (value.action === 'move') {
            startMove(note);
          } else if (value.action === 'resize') {
            startResize(note);
          }
        } else if (message.type === 'notes') {
          notes = Array.isArray(message.value) ? message.value : [];
          redrawAllNotes();
        } else if (message.type === 'tool') {
          const value = message.value || {};
          const next = {
            type: value.type || 'quote',
            shape: value.shape || 'line',
            color: value.color || 'yellow',
          };
          // Авто-переключение инструмента по клику на заметку не должно закрывать
          // её же меню: тип совпадает с типом заметки — это то же взаимодействие.
          if (!(noteMenu && noteMenu.noteType === next.type)) {
            closeNoteMenu();
            stopEditing();
          }
          tool = next;
          document.body.dataset.tool = tool.type;
        } else if (message.type === 'reader-theme') {
          applyReaderTheme(message.value);
        } else if (message.type === 'show') {
          // Область чтения снова видима: довести отрисовку под текущую
          // раскраску. Смена темы могла прийти в скрытой области, когда
          // рисовать было нечем, а наблюдатель размера в реальном webview
          // срабатывает ненадёжно. Сообщение от хоста идёт сразу за
          // возвратом видимости и перерисовывает «грязные» страницы.
          wakeViewerScroll();
          repaintDirtyPages();
        }
      });

      viewer.addEventListener('scroll', handleScroll, { passive: true });
      viewer.addEventListener('mouseup', handleSelectionOrGesture);
      viewer.addEventListener('pointerdown', handlePointerDown);
      pagesEl.addEventListener('pointerdown', startShapeDrag);
      pagesEl.addEventListener('pointermove', (event) => {
        if (moveDrag) {
          moveNoteDrag(event);
        } else if (resizeDrag) {
          moveResizeDrag(event);
        } else {
          moveShapeDrag(event);
        }
      });
      pagesEl.addEventListener('pointerup', finishGesture);
      pagesEl.addEventListener('pointercancel', finishGesture);
      document.addEventListener('selectionchange', handleSelectionChange);
      /* Клик по заметке: приложение выбирает её, а вьюер показывает меню действий. */
      pagesEl.addEventListener('click', (event) => {
        if (editClickSuppress) {
          editClickSuppress = false;
          return;
        }
        const target = event.target;
        const element =
          target && target.closest ? target.closest('[data-note-id]') : null;
        if (!element || !element.dataset.noteId) {
          closeNoteMenu();
          return;
        }
        post({ type: 'note-click', value: { noteId: element.dataset.noteId } });
        const note = noteById(element.dataset.noteId);
        if (note) {
          openNoteMenu(note, element);
        }
      });
      /** Перерисовка при смене плотности пикселей (перемещение между экранами). */
      let lastRatio = window.devicePixelRatio || 1;
      addEventListener('resize', () => {
        const ratio = window.devicePixelRatio || 1;
        if (ratio === lastRatio) {
          return;
        }
        lastRatio = ratio;
        renderEpoch += 1;
        for (const pageEl of pagesEl.children) {
          releasePage(pageEl);
        }
        for (const pageEl of pagesEl.children) {
          const rect = pageEl.getBoundingClientRect();
          if (rect.bottom > -1200 && rect.top < window.innerHeight + 1200) {
            void renderPage(pageEl);
          }
        }
      });

      /** Пересчёт окон при изменении области просмотра (панели, размер окна). */
      let lastViewerWidth = viewer.clientWidth;
      let lastViewerHeight = viewer.clientHeight;
      addEventListener('resize', () => {
        if (viewer.clientWidth === lastViewerWidth && viewer.clientHeight === lastViewerHeight) {
          return;
        }
        lastViewerWidth = viewer.clientWidth;
        lastViewerHeight = viewer.clientHeight;
        scheduleWindowRefresh();
      });

      /** Пересчёт окон при возврате размера области чтения.
       *
       * Пока рабочее место скрыто другим разделом (настройки, библиотека), у
       * области нулевой размер: смена темы или плотности в это время выпускает
       * страницы, но отрисовать их нечем. Наблюдатель размера срабатывает и при
       * скрытии (размер уходит в ноль), и при возврате — по возврате окна
       * пересчитываются, и выпущенные страницы рисуются заново. События `resize`
       * окна для этого недостаточно: размер iframe мог не измениться.
       */
      new ResizeObserver(() => {
        if (viewer.clientWidth > 0 && viewer.clientHeight > 0) {
          scheduleWindowRefresh();
        }
      }).observe(viewer);

      post({ type: 'capabilities', value: { zoom: true, pages: true, selection: true } });
      post({ type: 'ready' });
    </script>
  </body>
</html>
