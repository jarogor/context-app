<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Читалка PDF</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #525659;
        font-family: system-ui, sans-serif;
      }
      /* Область прокрутки: книга показывается целиком, все страницы подряд. */
      #viewer {
        position: absolute;
        inset: 0;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #8a8f98 #3f4247;
      }
      #viewer::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      #viewer::-webkit-scrollbar-track {
        background: #3f4247;
      }
      #viewer::-webkit-scrollbar-thumb {
        background: #8a8f98;
        border-radius: 6px;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
      }
      .page {
        position: relative;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        /* Подсветки заметок смешиваются только со страницей, не с фоном окна. */
        isolation: isolate;
      }
      .page canvas {
        /* Канвас покрывает видимую область страницы и позиционируется по ней. */
        position: absolute;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .overlay .note {
        position: absolute;
        background: rgba(253, 224, 71, 0.65);
        /* Умножение сохраняет тёмный текст контрастным, а фон делает жёлтым. */
        mix-blend-mode: multiply;
        border-radius: 2px;
        pointer-events: auto;
        cursor: pointer;
      }
      .overlay .note.flash {
        background: rgba(245, 158, 11, 0.85);
      }
      .textLayer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        line-height: 1;
        opacity: 0.25;
      }
      .textLayer span,
      .textLayer br {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      .textLayer ::selection {
        background: rgba(37, 99, 235, 0.35);
      }
      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5e7eb;
        padding: 24px;
        text-align: center;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewer"><div id="pages"></div></div>
    <div id="status">Ожидание книги…</div>

    <!--
      Классический скрипт выполняется до модульного: он получает blob-адреса
      файлов модуля (движок и worker). Модуль импортирует движок напрямую по
      этому адресу — без карты импорта и без сети.
    -->
    <script>
      (function () {
        window.__texturePdfEngine = textureViewerUrl('./pdf.mjs');
        window.__texturePdfWorker = textureViewerUrl('./pdf.worker.mjs');
      })();
    </script>

    <script type="module">
      const CHANNEL = 'texture-workplace';
      /** Соответствие пункта PDF и CSS-пикселя: 100 % — естественный размер. */
      const CSS_UNITS = 96 / 72;

      const status = document.getElementById('status');
      const viewer = document.getElementById('viewer');
      const pagesEl = document.getElementById('pages');

      let pdfjsLib = null;
      let doc = null;
      let pageCount = 0;
      let zoom = 100;
      let initialZoom = 100;
      let notes = [];
      /** Натуральный размер каждой страницы при масштабе 1 (CSS px). */
      let naturalSizes = [];
      /** Отрисованные страницы: элемент страницы → её холст. */
      const rendered = new Map();
      /** Страницы, отрисовка которых уже идёт. */
      const pending = new Set();
      /** Поколение рендера: смена масштаба отменяет незавершённые отрисовки. */
      let renderEpoch = 0;
      /** Запас вокруг видимой области страницы для канваса, CSS px. */
      const WINDOW_MARGIN = 512;
      /** Минимальная длина стороны канваса, CSS px. */
      const MIN_WINDOW_SIDE = 128;
      /** Предельный размер стороны канваса.
       *
       * Больше — браузер оставляет канвас белым; ограничение не даёт окну
       * выродиться на гигантском мониторе или при большом devicePixelRatio.
       */
      const MAX_CANVAS_SIDE = 8192;
      /** Предельная площадь канваса (пиксели): страховка от нехватки памяти. */
      const MAX_CANVAS_AREA = 32 * 1024 * 1024;
      /** Опорная страница окна (для удержания места при масштабе). */
      let currentPage = 1;
      let observer = null;
      let scheduled = false;
      /** Отложенный пересчёт окна канвасов после прокрутки. */
      let windowScheduled = false;

      function post(message) {
        message.channel = CHANNEL;
        parent.postMessage(message, '*');
      }

      function decodeBase64(value) {
        const binary = atob(String(value || ''));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      /** Масштаб отображения: 100 % — естественный размер страницы файла. */
      function currentScale() {
        return (zoom / 100) * CSS_UNITS;
      }

      /** Плотность растра канваса: не выше разумного предела и не выше
       * предела размера и площади канваса (иначе браузер оставит его белым).
       */
      function boundedRatio(width, height) {
        let ratio = Math.min(window.devicePixelRatio || 1, 2.5);
        if (width > 0 && width * ratio > MAX_CANVAS_SIDE) {
          ratio = MAX_CANVAS_SIDE / width;
        }
        if (height > 0 && height * ratio > MAX_CANVAS_SIDE) {
          ratio = MAX_CANVAS_SIDE / height;
        }
        const area = width * height;
        if (area > 0 && area * ratio * ratio > MAX_CANVAS_AREA) {
          ratio = Math.sqrt(MAX_CANVAS_AREA / area);
        }
        return Math.max(0.25, ratio);
      }

      /** Привязка координаты к пиксельной сетке устройства.
       *
       * Канвас, чей размер или положение в устройстве дробные, браузер
       * пересэмплирует при выводе — текст мутнеет. Округление до целого
       * физического пикселя убирает пересэмплирование: растр выводится 1:1.
       */
      function snapToDevice(value, ratio) {
        return Math.round(value * ratio) / ratio;
      }

      /** Признак, что вся страница помещается в пределы канваса при плотности. */
      function fitsWholePage(viewport, ratio) {
        return (
          viewport.width * ratio <= MAX_CANVAS_SIDE &&
          viewport.height * ratio <= MAX_CANVAS_SIDE &&
          viewport.width * viewport.height * ratio * ratio <= MAX_CANVAS_AREA
        );
      }

      /** Желаемое окно страницы в CSS-пикселях (координаты относительно страницы).
       *
       * Если растр всей страницы помещается в пределы канваса, рисуется вся
       * страница: тогда прокрутка внутри неё ничего не перерисовывает, и текст
       * не пропадает на время отрисовки. Окно видимой области с запасом
       * применяется только к страницам, которые целиком не помещаются (сильное
       * увеличение) — там память ограничивается видимой областью.
       */
      function desiredWindow(rect, viewerRect, viewport) {
        const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
        if (fitsWholePage(viewport, ratio)) {
          return { x0: 0, y0: 0, width: viewport.width, height: viewport.height };
        }
        const x0 = Math.max(0, viewerRect.left - rect.left - WINDOW_MARGIN);
        const y0 = Math.max(0, viewerRect.top - rect.top - WINDOW_MARGIN);
        const x1 = Math.min(
          viewport.width,
          viewerRect.left + viewer.clientWidth - rect.left + WINDOW_MARGIN,
        );
        const y1 = Math.min(
          viewport.height,
          viewerRect.top + viewer.clientHeight - rect.top + WINDOW_MARGIN,
        );
        const width = Math.max(MIN_WINDOW_SIDE, x1 - x0);
        const height = Math.max(MIN_WINDOW_SIDE, y1 - y0);
        return {
          x0: Math.min(x0, Math.max(0, viewport.width - width)),
          y0: Math.min(y0, Math.max(0, viewport.height - height)),
          width: Math.min(width, viewport.width),
          height: Math.min(height, viewport.height),
        };
      }

      /** Подготовка канваса страницы: окно и плотность.
       *
       * Канвас рисуется в пикселях с плотностью devicePixelRatio: вся страница,
       * если её растр помещается в пределы канваса (обычные масштабы), иначе —
       * окно видимой области с запасом (сильное увеличение), чтобы память была
       * ограничена видимой областью. Геометрия задаётся до отрисовки:
       * изменение размеров канваса после неё стёрло бы рисунок. Границы окна
       * привязаны к пиксельной сетке устройства по абсолютной экранной позиции:
       * сама страница стоит в дробной координате, поэтому иначе браузер
       * пересэмплирует растр и текст мутнеет.
       */
      function setupCanvas(pageEl, viewport) {
        const canvas = document.createElement('canvas');
        const rect = pageEl.getBoundingClientRect();
        const viewerRect = viewer.getBoundingClientRect();
        const base = desiredWindow(rect, viewerRect, viewport);
        const ratio = boundedRatio(base.width, base.height);
        const absX0 = snapToDevice(rect.left + base.x0, ratio);
        const absY0 = snapToDevice(rect.top + base.y0, ratio);
        const absRight = snapToDevice(rect.left + base.x0 + base.width, ratio);
        const absBottom = snapToDevice(rect.top + base.y0 + base.height, ratio);
        const x = absX0 - rect.left;
        const y = absY0 - rect.top;
        const width = Math.max(1, absRight - absX0);
        const height = Math.max(1, absBottom - absY0);
        canvas.width = Math.max(1, Math.round(width * ratio));
        canvas.height = Math.max(1, Math.round(height * ratio));
        canvas.style.left = x + 'px';
        canvas.style.top = y + 'px';
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        return {
          canvas,
          info: { x, y, width, height, ratio },
        };
      }

      /** Доля прочитанного по положению прокрутки. */
      function scrollProgress() {
        const max = viewer.scrollHeight - viewer.clientHeight;
        return max > 0 ? Math.max(0, Math.min(100, (viewer.scrollTop / max) * 100)) : 0;
      }

      /** Размер страницы в пикселях при текущем масштабе. */
      function pageSize(index) {
        const natural = naturalSizes[index] || naturalSizes[0] || { width: 612, height: 792 };
        const scale = currentScale();
        return { width: natural.width * scale, height: natural.height * scale };
      }

      /** Обновление размеров страниц после уточнения их размеров. */
      function resizePage(index) {
        const pageEl = pagesEl.children[index];
        if (!pageEl || pageEl.dataset.rendered === '1') {
          return;
        }
        const size = pageSize(index);
        pageEl.style.width = size.width + 'px';
        pageEl.style.height = size.height + 'px';
      }

      function reportState() {
        post({ type: 'state', value: { page: currentPage, pages: pageCount, zoom } });
        post({ type: 'progress', value: scrollProgress() });
      }

      async function loadEngine() {
        if (pdfjsLib) {
          return pdfjsLib;
        }
        pdfjsLib = await import(window.__texturePdfEngine);
        pdfjsLib.GlobalWorkerOptions.workerSrc = window.__texturePdfWorker;
        return pdfjsLib;
      }

      /** Построение каркаса страниц: размеры без рендера. */
      function layoutPages() {
        pagesEl.replaceChildren();
        for (let index = 0; index < pageCount; index += 1) {
          const size = pageSize(index);
          const pageEl = document.createElement('div');
          pageEl.className = 'page';
          pageEl.dataset.page = String(index + 1);
          pageEl.style.width = size.width + 'px';
          pageEl.style.height = size.height + 'px';
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          pageEl.append(overlay);
          pagesEl.append(pageEl);
        }
      }

      /** Обновление размеров каркаса при смене масштаба. */
      function resizePages() {
        for (const pageEl of pagesEl.children) {
          const index = Number(pageEl.dataset.page) - 1;
          const size = pageSize(index);
          pageEl.style.width = size.width + 'px';
          pageEl.style.height = size.height + 'px';
        }
      }

      function overlayOf(pageEl) {
        return pageEl.querySelector('.overlay');
      }

      /** Освобождение канваса и текстового слоя страницы (память при прокрутке). */
      function releasePage(pageEl) {
        pending.delete(pageEl);
        const entry = rendered.get(pageEl);
        delete pageEl.dataset.rendered;
        if (!entry) {
          return;
        }
        entry.canvas.remove();
        entry.textLayer.remove();
        rendered.delete(pageEl);
      }

      /** Отрисовка страницы: окно канваса, текстовый слой, подсветки заметок. */
      async function renderPage(pageEl) {
        if (rendered.has(pageEl) || pending.has(pageEl) || !doc) {
          return;
        }
        const index = Number(pageEl.dataset.page) - 1;
        const epoch = renderEpoch;
        pending.add(pageEl);
        let page;
        try {
          page = await doc.getPage(index + 1);
        } catch (error) {
          pending.delete(pageEl);
          return;
        }
        if (!pageEl.isConnected || epoch !== renderEpoch) {
          pending.delete(pageEl);
          return;
        }
        const base = page.getViewport({ scale: 1 });
        naturalSizes[index] = { width: base.width, height: base.height };
        resizePage(index);
        const scale = currentScale();
        const viewport = page.getViewport({ scale });
        pageEl.style.width = viewport.width + 'px';
        pageEl.style.height = viewport.height + 'px';
        pageEl.style.setProperty('--scale-factor', String(scale));

        const setup = setupCanvas(pageEl, viewport);
        const canvas = setup.canvas;
        const info = setup.info;
        const context = canvas.getContext('2d');
        if (!context) {
          pending.delete(pageEl);
          return;
        }

        const textLayerEl = document.createElement('div');
        textLayerEl.className = 'textLayer';
        const overlay = overlayOf(pageEl);
        if (!overlay) {
          pending.delete(pageEl);
          return;
        }
        const entry = { canvas, textLayer: textLayerEl, info };
        pageEl.insertBefore(canvas, overlay);
        pageEl.insertBefore(textLayerEl, overlay);
        rendered.set(pageEl, entry);
        pageEl.dataset.rendered = '1';

        // Дополнительное преобразование сдвигает страницу в начало координат
        // окна (её левый верх не совпадает с углом страницы) и задаёт плотность
        // devicePixelRatio: без него рисовалась бы левая верхняя часть страницы
        // в неверном масштабе.
        const transform = [
          info.ratio,
          0,
          0,
          info.ratio,
          -info.x * info.ratio,
          -info.y * info.ratio,
        ];

        try {
          await page.render({ canvasContext: context, viewport, transform }).promise;
          if (epoch !== renderEpoch) {
            throw new Error('отрисовка устарела из-за смены масштаба');
          }
          const textLayer = new pdfjsLib.TextLayer({
            textContentSource: page.streamTextContent(),
            container: textLayerEl,
            viewport,
          });
          await textLayer.render();
          if (epoch !== renderEpoch) {
            throw new Error('отрисовка устарела из-за смены масштаба');
          }
          drawNotes(pageEl);
        } catch (error) {
          // Неудачная отрисовка не должна навсегда помечать страницу готовой:
          // иначе она останется белой и повторный рендер не запустится.
          if (rendered.get(pageEl) === entry) {
            rendered.delete(pageEl);
            delete pageEl.dataset.rendered;
          }
          canvas.remove();
          textLayerEl.remove();
        } finally {
          pending.delete(pageEl);
        }
      }

      /** Наблюдение за видимостью страниц: рендер вблизи, освобождение вдали. */
      function startObserver() {
        if (observer) {
          observer.disconnect();
        }
        observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              const pageEl = entry.target;
              if (entry.isIntersecting) {
                void renderPage(pageEl);
              } else if (entry.intersectionRatio === 0) {
                releasePage(pageEl);
              }
            }
          },
          { root: viewer, rootMargin: '1200px 0px' },
        );
        for (const pageEl of pagesEl.children) {
          observer.observe(pageEl);
        }
      }

      /** Пересчёт окон отрисованных страниц при прокрутке.
       *
       * Когда страница рисуется целиком (обычные масштабы), видимая область
       * всегда внутри её канваса, и перерисовки при прокрутке не происходит.
       * Когда страница целиком не помещается и нарисована окном, прокрутка,
       * уводящая видимую область за пределы окна, освобождает страницу и
       * рисует её заново под новое положение.
       */
      function refreshWindows() {
        windowScheduled = false;
        const viewerRect = viewer.getBoundingClientRect();
        for (const pageEl of pagesEl.children) {
          const entry = rendered.get(pageEl);
          if (!entry) {
            continue;
          }
          const index = Number(pageEl.dataset.page) - 1;
          if (!naturalSizes[index]) {
            continue;
          }
          const rect = pageEl.getBoundingClientRect();
          const interTop = Math.max(rect.top, viewerRect.top);
          const interBottom = Math.min(rect.bottom, viewerRect.bottom);
          const interLeft = Math.max(rect.left, viewerRect.left);
          const interRight = Math.min(rect.right, viewerRect.right);
          if (interBottom <= interTop || interRight <= interLeft) {
            continue;
          }
          // Видимая область и окно канваса — в одной системе: CSS-пиксели
          // относительно страницы.
          const visTop = interTop - rect.top;
          const visBottom = interBottom - rect.top;
          const visLeft = interLeft - rect.left;
          const visRight = interRight - rect.left;
          const info = entry.info;
          const covered =
            visTop >= info.y &&
            visBottom <= info.y + info.height &&
            visLeft >= info.x &&
            visRight <= info.x + info.width;
          if (!covered) {
            releasePage(pageEl);
            void renderPage(pageEl);
          }
        }
      }

      /** Планирование пересчёта окон после прокрутки. */
      function scheduleWindowRefresh() {
        if (windowScheduled) {
          return;
        }
        windowScheduled = true;
        requestAnimationFrame(refreshWindows);
      }

      /** Доля пересечения меньшего прямоугольника; ниже — это соседние строки. */
      function overlapRatio(a, b) {
        const left = Math.max(a.x, b.x);
        const top = Math.max(a.y, b.y);
        const right = Math.min(a.x + a.width, b.x + b.width);
        const bottom = Math.min(a.y + a.height, b.y + b.height);
        if (right <= left || bottom <= top) {
          return 0;
        }
        const intersection = (right - left) * (bottom - top);
        const smaller = Math.min(a.width * a.height, b.width * b.height);
        return smaller > 0 ? intersection / smaller : 0;
      }

      /** Объединение совпадающих прямоугольников строки в один.
       *
       * Текстовый слой иногда даёт по нескольку прямоугольников на одну строку;
       * при отрисовке они накладываются и жёлтый становится плотнее. Прямоугольники
       * соседних строк пересекаются лишь краем и не объединяются.
       */
      function mergeRects(rects) {
        const merged = [];
        for (const rect of rects) {
          let current = { ...rect };
          let changed = true;
          while (changed) {
            changed = false;
            for (let index = 0; index < merged.length; index += 1) {
              const other = merged[index];
              if (overlapRatio(current, other) < 0.5) {
                continue;
              }
              const left = Math.min(current.x, other.x);
              const top = Math.min(current.y, other.y);
              const right = Math.max(current.x + current.width, other.x + other.width);
              const bottom = Math.max(current.y + current.height, other.y + other.height);
              current = { x: left, y: top, width: right - left, height: bottom - top };
              merged.splice(index, 1);
              changed = true;
              break;
            }
          }
          merged.push(current);
        }
        return merged;
      }

      /** Подсветка заметок на странице по долям её размера. */
      function drawNotes(pageEl) {
        const overlay = overlayOf(pageEl);
        if (!overlay) {
          return;
        }
        overlay.replaceChildren();
        const index = Number(pageEl.dataset.page);
        for (const note of notes) {
          if (!note.anchor) {
            continue;
          }
          let anchor;
          try {
            anchor = JSON.parse(note.anchor);
          } catch (error) {
            continue;
          }
          if (!anchor || anchor.kind !== 'page' || anchor.page !== index) {
            continue;
          }
          for (const rect of mergeRects(anchor.rects || [])) {
            const element = document.createElement('div');
            element.className = 'note';
            element.dataset.noteId = note.id;
            element.style.left = rect.x * 100 + '%';
            element.style.top = rect.y * 100 + '%';
            element.style.width = rect.width * 100 + '%';
            element.style.height = rect.height * 100 + '%';
            overlay.appendChild(element);
          }
        }
      }

      function redrawAllNotes() {
        for (const pageEl of pagesEl.children) {
          drawNotes(pageEl);
        }
      }

      /** Страница, находящаяся у верха области чтения. */
      function pageAtTop() {
        const top = viewer.scrollTop;
        let result = 1;
        for (const pageEl of pagesEl.children) {
          const offset = pageEl.offsetTop;
          if (offset <= top + 8) {
            result = Number(pageEl.dataset.page);
          } else {
            break;
          }
        }
        return result;
      }

      /** Обновление текущей страницы и прогресса после прокрутки. */
      function handleScroll() {
        if (!doc || scheduled) {
          return;
        }
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          const page = pageAtTop();
          if (page !== currentPage) {
            currentPage = page;
          }
          reportState();
          scheduleWindowRefresh();
        });
      }

      /** Прокрутка к доле книги в процентах. */
      function scrollToFraction(percent) {
        const max = viewer.scrollHeight - viewer.clientHeight;
        viewer.scrollTop = max * (Math.max(0, Math.min(100, percent)) / 100);
      }

      /** Прокрутка к странице (постраничный режим помещает её в область видимости). */
      function gotoPage(page) {
        const target = Math.max(1, Math.min(pageCount, Math.trunc(page)));
        const pageEl = pagesEl.children[target - 1];
        if (pageEl) {
          pageEl.scrollIntoView({ block: 'start' });
          currentPage = target;
          reportState();
          scheduleWindowRefresh();
        }
      }

      function flashNote(noteId) {
        if (!noteId) {
          return;
        }
        for (const element of document.querySelectorAll(`.note[data-note-id="${noteId}"]`)) {
          element.classList.add('flash');
          setTimeout(() => element.classList.remove('flash'), 1200);
        }
      }

      async function open(data, position, zoomValue) {
        status.textContent = 'Открытие книги…';
        status.hidden = false;
        pagesEl.replaceChildren();
        // Предыдущая книга: освобождаем её холсты, иначе карта держала бы их.
        rendered.clear();
        pending.clear();
        renderEpoch += 1;
        try {
          const lib = await loadEngine();
          doc = await lib.getDocument({ data: decodeBase64(data) }).promise;
          pageCount = doc.numPages;
          initialZoom = Number(zoomValue) || 100;
          zoom = initialZoom;
          const first = await doc.getPage(1);
          const firstBase = first.getViewport({ scale: 1 });
          naturalSizes = new Array(pageCount).fill({
            width: firstBase.width,
            height: firstBase.height,
          });
          layoutPages();
          startObserver();
          status.hidden = true;
          scrollToFraction(position);
          currentPage = pageAtTop();
          reportState();
        } catch (error) {
          status.textContent = 'Не удалось отобразить книгу: ' + error;
          post({ type: 'error', message: String(error) });
        }
      }

      /** Применение масштаба с удержанием опорной страницы на месте. */
      function applyZoom(value) {
        if (!doc) {
          return;
        }
        const next = Number(value) || 100;
        if (next === zoom) {
          return;
        }
        const anchorEl = pagesEl.children[currentPage - 1];
        const offsetBefore = anchorEl ? anchorEl.offsetTop - viewer.scrollTop : 0;
        zoom = next;
        // Смена масштаба отменяет незавершённые отрисовки: иначе они завершатся
        // в старом масштабе и оставят страницу белой.
        renderEpoch += 1;
        resizePages();
        for (const pageEl of pagesEl.children) {
          releasePage(pageEl);
        }
        for (const pageEl of pagesEl.children) {
          const rect = pageEl.getBoundingClientRect();
          if (rect.bottom > -1200 && rect.top < window.innerHeight + 1200) {
            void renderPage(pageEl);
          }
        }
        if (anchorEl) {
          viewer.scrollTop = anchorEl.offsetTop - offsetBefore;
        }
        reportState();
      }

      /** Доля выделения в долях размера страницы. */
      function fractionRect(bounds, pageBounds) {
        return {
          x: (bounds.left - pageBounds.left) / pageBounds.width,
          y: (bounds.top - pageBounds.top) / pageBounds.height,
          width: bounds.width / pageBounds.width,
          height: bounds.height / pageBounds.height,
        };
      }

      function handleSelection() {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
          return;
        }
        const range = selection.getRangeAt(0);
        const startLayer = elementOf(range.startContainer)?.closest('.textLayer');
        const endLayer = elementOf(range.endContainer)?.closest('.textLayer');
        if (!startLayer || startLayer !== endLayer) {
          return;
        }
        const pageEl = startLayer.closest('.page');
        if (!pageEl) {
          return;
        }
        const quote = selection.toString().replace(/\s+/g, ' ').trim();
        if (!quote) {
          return;
        }
        const pageBounds = pageEl.getBoundingClientRect();
        const rects = [];
        for (const bounds of range.getClientRects()) {
          if (bounds.width <= 0 || bounds.height <= 0) {
            continue;
          }
          rects.push(fractionRect(bounds, pageBounds));
        }
        if (rects.length === 0) {
          return;
        }
        const first = range.getClientRects()[0];
        const page = Number(pageEl.dataset.page);
        post({
          type: 'selection',
          value: {
            anchor: {
              v: 1,
              kind: 'page',
              chapter: 0,
              start: 0,
              end: 0,
              quote,
              percent: scrollProgress(),
              page,
              rects: mergeRects(rects),
            },
            x: first.left,
            y: first.bottom,
          },
        });
      }

      function elementOf(node) {
        return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      }

      /** Снятие меню при пропаже выделения. */
      function handleSelectionChange() {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) {
          post({ type: 'selection-cleared' });
        }
      }

      addEventListener('message', async (event) => {
        const message = event.data;
        if (!message || message.channel !== CHANNEL) {
          return;
        }
        if (message.type === 'open') {
          await open(message.data, Number(message.position) || 0, message.zoom);
        } else if (message.type === 'zoom') {
          applyZoom(message.value);
        } else if (message.type === 'goto') {
          const value = message.value || {};
          if (typeof value.page === 'number') {
            gotoPage(value.page);
          } else if (typeof value.anchor === 'string') {
            let anchor;
            try {
              anchor = JSON.parse(value.anchor);
            } catch (error) {
              anchor = null;
            }
            if (anchor && anchor.page) {
              gotoPage(anchor.page);
              setTimeout(() => flashNote(value.noteId), 60);
            }
          }
        } else if (message.type === 'notes') {
          notes = Array.isArray(message.value) ? message.value : [];
          redrawAllNotes();
        }
      });

      viewer.addEventListener('scroll', handleScroll, { passive: true });
      viewer.addEventListener('mouseup', handleSelection);
      document.addEventListener('selectionchange', handleSelectionChange);
      /* Клик по подсветке: приложение открывает панель заметок и выбирает её. */
      pagesEl.addEventListener('click', (event) => {
        const target = event.target;
        const note = target && target.closest ? target.closest('.note') : null;
        if (note && note.dataset.noteId) {
          post({ type: 'note-click', value: { noteId: note.dataset.noteId } });
        }
      });
      /** Перерисовка при смене плотности пикселей (перемещение между экранами). */
      let lastRatio = window.devicePixelRatio || 1;
      addEventListener('resize', () => {
        const ratio = window.devicePixelRatio || 1;
        if (ratio === lastRatio) {
          return;
        }
        lastRatio = ratio;
        renderEpoch += 1;
        for (const pageEl of pagesEl.children) {
          releasePage(pageEl);
        }
        for (const pageEl of pagesEl.children) {
          const rect = pageEl.getBoundingClientRect();
          if (rect.bottom > -1200 && rect.top < window.innerHeight + 1200) {
            void renderPage(pageEl);
          }
        }
      });

      /** Пересчёт окон при изменении области просмотра (панели, размер окна). */
      let lastViewerWidth = viewer.clientWidth;
      let lastViewerHeight = viewer.clientHeight;
      addEventListener('resize', () => {
        if (viewer.clientWidth === lastViewerWidth && viewer.clientHeight === lastViewerHeight) {
          return;
        }
        lastViewerWidth = viewer.clientWidth;
        lastViewerHeight = viewer.clientHeight;
        scheduleWindowRefresh();
      });

      post({ type: 'capabilities', value: { zoom: true, pages: true, selection: true } });
      post({ type: 'ready' });
    </script>
  </body>
</html>
