<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Читалка PDF</title>
    <!--texture-viewer-style-->
  </head>
  <body>
    <div id="viewer"><div id="pages"></div></div>
    <div id="status">Ожидание книги…</div>

    <!--
      Классический скрипт выполняется до модульного: он получает blob-адреса
      файлов модуля (движок и worker) и подключает собранный бандл. Модуль
      ссылается на движок по этому адресу — без карты импорта и без сети.
    -->
    <script>
      (function () {
        window.__texturePdfEngine = textureViewerUrl('./pdf.mjs');
        window.__texturePdfWorker = textureViewerUrl('./pdf.worker.mjs');
      })();
    </script>

    <script type="module">
      import(textureViewerUrl('./viewer.js'));
    </script>
  </body>
</html>
