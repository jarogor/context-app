[package]
name = "settings"
version = "0.1.0"
description = "Базовый плагин настроек приложения «Контекст» и её плагинов"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
host-sdk = { path = "../../src-wasm-sdk/host-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui-sdk = { path = "../../src-wasm-sdk/ui-sdk" }
