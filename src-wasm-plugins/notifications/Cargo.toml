[package]
name = "notifications"
version = "0.1.0"
description = "Базовый плагин уведомлений и технических логов приложения «Текстура»"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4.1"
plugin-host = { path = "../plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
