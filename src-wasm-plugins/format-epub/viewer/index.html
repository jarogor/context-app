<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Читалка EPUB</title>
    <style>
html,
body {
  margin: 0;
  /* Прокручивается сам документ книги: только у него одного есть полоса
     прокрутки, поэтому прогресс и переходы считаются по `scrollingElement`
     без промежуточного контейнера. */
  background: var(--rt-background, #ffffff);
  color: var(--rt-foreground, #1f2937);
}

#viewer {
  min-height: 100%;
}

#status {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--rt-muted, #6b7280);
  font-family: system-ui, sans-serif;
}

#status[hidden] {
  display: none;
}

    </style>
  </head>
  <body>
    <div id="viewer"><div id="chapters"></div></div>
    <div id="status">Ожидание книги…</div>

    <script type="module">
      import(contextViewerUrl('./viewer.js'));
    </script>
  </body>
</html>
