[package]
name = "jarogor-texture"
version = "0.1.0"
description = "Текстура: персональная библиотека книг с портируемым хранением"
authors = ["you"]
edition = "2021"

[lib]
name = "jarogor_texture_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Tauri 2.12 тянет tao >= 0.37, где исправлен баг Wayland CSD: окно,
# созданное скрытым и показанное позже, оставляло системные кнопки
# неработоспособными (tauri-apps/tao#1046, PR #1218).
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
tempfile = "3"
extism = "1.30"
base64 = "0.22"
tauri-plugin-dialog = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
open = "5"
zip = { version = "3", default-features = false, features = ["deflate"] }
uuid = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
wat = "1"
