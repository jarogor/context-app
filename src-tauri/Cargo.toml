[package]
name = "jarogor-texture"
version = "0.1.0"
description = "Текстура: персональная библиотека книг с портируемым хранением"
authors = ["you"]
edition = "2021"

[lib]
name = "jarogor_texture_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
tempfile = "3"
extism = "1.30"
base64 = "0.22"
tauri-plugin-dialog = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
open = "5"
zip = { version = "3", default-features = false, features = ["deflate"] }
uuid = "1"

[dev-dependencies]
wat = "1"
