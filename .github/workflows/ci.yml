# Проверки «Контекста» на push и pull request.
#
# Повторяет ключевые шаги `make verify` (см. `AGENTS.md`), но без релизной
# упаковки: тесты, линтеры, типы и сборка. Релизные пакеты собирает
# `release.yml`.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Фронтенд (типы и тесты)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Форматирование
        run: npm run check:ts

      - name: Типы и форматирование Svelte
        run: npm run check

      - name: Модульные тесты
        run: npm test

  rust:
    name: Rust (тесты, clippy, fmt)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-wasm-plugins -> target
            src-wasm-sdk -> target

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - run: npm ci

      # Плагины собираются тем же скриптом, что и локально: артефакты в git
      # не хранятся, а тесты чтения и браузерные сценарии их требуют.
      - name: Плагины
        run: npm run build:plugins

      - name: Артефакты актуальны
        run: npm run check:artifacts

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Тесты плагинов
        run: cargo test --manifest-path src-wasm-plugins/Cargo.toml

      - name: Тесты SDK
        run: cargo test --manifest-path src-wasm-sdk/Cargo.toml

      - name: Clippy и форматирование
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-wasm-plugins/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo fmt --manifest-path src-wasm-plugins/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-wasm-sdk/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-wasm-sdk/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo fmt --manifest-path src-wasm-sdk/Cargo.toml --all -- --check

  e2e:
    name: Браузерные тесты и сборка
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-wasm-plugins -> target
            src-wasm-sdk -> target

      - run: npm ci

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: Браузерные тесты
        run: npm run test:e2e

      - name: Полная сборка фронтенда
        run: npm run build
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
