# Сборка релиза «Контекста» под Linux и Windows.
#
# Запуск: тег вида `v1.2.3` (создаётся черновик релиза с пакетами) или вручную
# через `workflow_dispatch` (пакеты прикладываются как артефакты сборки).
#
# Ядро и каркасные плагины обновляются одним пакетом (см. `UPDATE.md`), поэтому
# собираются вместе с приложением. Плагины собирает `beforeBuildCommand`
# (`npm run build` → `build:plugins`), отдельного шага для них не нужно.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            bundles: appimage,deb
          # Установщик собирается на Windows, чтобы получить нативный .exe:
          # NSIS кросс-сборкой на Linux не делается.
          - platform: windows-x86_64
            runs-on: windows-latest
            bundles: nsis

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Плагины собираются в WASM: цель нужна и на Windows, и на Linux.
          targets: wasm32-unknown-unknown

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-wasm-plugins -> target
            src-wasm-sdk -> target

      - name: Системные зависимости Tauri (Linux)
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Зависимости npm
        run: npm ci

      - name: Сборка релиза (тег)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Контекст ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Сборка без релиза (ручной запуск)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Артефакты сборки
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: context-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
